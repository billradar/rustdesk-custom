[package]
name = "api-failover-harness"
version = "0.1.0"
edition = "2021"
[dependencies]
reqwest = { version = "=0.12.28", features = ["blocking", "socks", "json", "native-tls", "rustls-tls", "rustls-tls-native-roots", "gzip", "zstd"], default-features = false }
tokio = { version = "=1.44.2", features = ["macros", "rt-multi-thread", "net", "time"] }
log = "0.4"
[dev-dependencies]
serde_json = "1"
