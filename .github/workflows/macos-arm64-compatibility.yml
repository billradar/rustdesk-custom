name: Mac ARM64 Flutter recipe compatibility
'on':
  pull_request:
    paths:
    - '.github/workflows/macos-arm64-compatibility.yml'
    - '.github/workflows/build-platform.yml'
    - '.github/workflows/build-stable-platforms.yml'
    - 'scripts/build/macos_arm64*'
    - 'scripts/platform/platform_adapter.py'
    - 'scripts/platform/platform_commands.py'
    - 'metadata/build/macos-arm64-policy.json'
    - 'metadata/platform/matrix.json'
    - 'metadata/platform/runner-migrations.json'
    - 'metadata/platform/adapter-profiles.json'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: macos-arm64-recipe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-sdk:
    name: Verify native Mac ARM SDK and reviewed source helper
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      UPSTREAM_EXPECTED_SHA: f4c0b13df71ec343b57fc98ae39c4b81845624cb
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Isolated reviewed parser environment
      run: |
        python3 -m venv .work/python
        .work/python/bin/python -m pip install -r requirements.txt
        echo "$PWD/.work/python/bin" >> "$GITHUB_PATH"
    - name: Fetch exact reviewed official source without production inputs
      run: bash scripts/source/prepare.sh "$UPSTREAM_EXPECTED_SHA" .work/mac-smoke
    - name: Verify recipe before running upstream helper or SDK commands
      id: profile
      run: python3 -m scripts.build.macos_arm64 profile .work/mac-smoke
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: ${{ steps.profile.outputs.flutter }}
        channel: stable
    - name: Verify native SDK and GNU-sed source adaptation
      run: |
        python3 - <<'PY'
        from scripts.build.macos_arm64 import profile,verify_sdk
        verify_sdk(profile('.work/mac-smoke'))
        PY
        flutter config --no-enable-swift-package-manager
        brew install gnu-sed
        export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
        (cd .work/mac-smoke && bash .github/patches/apply_flutter_3.44_source_patches.sh)
        python3 - <<'PY'
        import os,shutil,subprocess,tempfile
        from pathlib import Path
        from scripts.build.macos_arm64 import DEPLOYMENT_EDITS,TRANSFORMS,original,protected_digest,sha,verify_sdk
        from scripts.platform.platform_adapter import render
        verify_sdk(original('.work/mac-smoke')[0])
        changed=subprocess.check_output(['git','-C','.work/mac-smoke','diff','--name-only'],text=True).splitlines()
        if set(changed)!=set(TRANSFORMS):raise ValueError('Source helper changed an unexpected file inventory')
        source=Path('.work/mac-smoke');p,job=original(source)
        script=render(next(s['run'] for s in job['steps'] if s.get('name')=='Build rustdesk'),p)
        prefix,separator,_=script.partition('./build.py --flutter')
        if not separator:raise ValueError('Unknown official build invocation')
        before={name:sha(source/name) for name in DEPLOYMENT_EDITS}
        with tempfile.TemporaryDirectory() as tmp:
            root=Path(tmp)
            for name in (*DEPLOYMENT_EDITS,'flutter/macos/Podfile','flutter/macos/Runner.xcodeproj/project.pbxproj'):
                dest=root/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source/name,dest)
            subprocess.run(['bash','-euo','pipefail','-c',prefix],cwd=root,check=True,
                           env=dict(os.environ,GITHUB_ENV=str(root/'github-env')))
            for name in DEPLOYMENT_EDITS:
                if protected_digest(root,name,post_build=True)!=before[name]:
                    raise ValueError('Unexpected official deployment transformation: '+name)
        print('Actual official native deployment-target edits: PASS')
        print('Native Mac ARM SDK and reviewed source helper: PASS; application compilation/runtime not tested')
        PY

  intel-runner:
    name: Verify migrated macOS 26 Intel runner
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Verify native Intel runner and toolchain
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -m)" = "x86_64"
        sw_vers
        xcodebuild -version
        brew --version
        echo "macOS 26 Intel runner smoke: PASS (no application build or signing)"

  runner-policy-contract:
    name: Validate fail-closed runner migration policy
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Run runner migration contract
      run: python3 -m scripts.platform.runner_migrations_contract
