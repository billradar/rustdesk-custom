name: Android Production Signing Identity Validation
# Validation entrypoint reviewed with actionlint; private staging uses step runtime context.
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        default: '1.4.9'
        description: Official stable tag; artifacts only, no release writes
      validation_enable_signing:
        type: boolean
        required: false
        default: false
        description: One-shot hardware signing; keep disabled unless separately authorized
permissions:
  contents: read
  actions: read
concurrency:
  group: android-signing-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yubikey-identity-preflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[validate-android-signing]')
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with: {persist-credentials: false}
    - name: Validate public YubiKey identity metadata without accessing the token
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        info = json.loads(Path('metadata/yubikey-android-signing-identity.json').read_text())
        assert info['certificate_sha256'] == '559c1ede0fbe3a01f29bcac9d0b34bd9691df3562c83e3019a930506fbc7b6f5'
        assert info['piv_slot'] == '9C' and info['pkcs11_id'] == '02'
        assert info['legacy_android_signing_identity'] == 'NOT RECOVERED / NOT VALIDATED'
        print('New YubiKey identity metadata: PASS; legacy identity remains unvalidated.')
        PY
  resolve:
    needs: yubikey-identity-preflight
    runs-on: ubuntu-22.04
    outputs:
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with: {persist-credentials: false}
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref || '1.4.9' }}
      run: python3 scripts/phase4.py resolve --channel stable --ref "$REQUESTED_REF" --discovery-only
  compatibility:
    needs: resolve
    uses: ./.github/workflows/compat-check.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      # CI compatibility omits the Windows helper build. No Desktop client build runs.
      channel: ci
  prepare:
    needs: [resolve, compatibility]
    uses: ./.github/workflows/prepare-source.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      patchset: ${{ needs.compatibility.outputs.patchset }}
      channel: ci
  android-build:
    needs: [resolve, compatibility, prepare]
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: android
      arch: ${{ matrix.arch }}
      variant: standard
      runner: ubuntu-24.04
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      upstream_version: ${{ needs.prepare.outputs.upstream_version }}
      patchset: ${{ needs.compatibility.outputs.patchset }}
      channel: signing-validation
      source_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      production_signing: true
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  android-sign:
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/android-signing-validation.yml@refs/heads/main'
    needs: [resolve, compatibility, prepare, android-build]
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    name: Sign Android ${{ matrix.arch }} with YubiKey PIV 9C
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-yubikey-signing
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    env:
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      SIGNING_ARCH: ${{ matrix.arch }}
    steps:
      - name: Download this run's Android unsigned build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: android-build-input-signing-validation-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-standard-android-${{ matrix.arch }}
          path: .work/android-build-input
      - name: Validate artifact origin, checksum, package, ABI, and source provenance
        id: input
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path

          root = Path('.work/android-build-input').resolve()
          expected_arches = {'aarch64': 'arm64-v8a', 'armv7': 'armeabi-v7a', 'x86_64': 'x86_64'}
          arch = os.environ['SIGNING_ARCH']
          if arch not in expected_arches:
              raise SystemExit('SIGNING: unsupported Android architecture')
          manifests = list(root.rglob('build-info.json'))
          if len(manifests) != 1:
              raise SystemExit('SIGNING: expected exactly one build manifest')
          bundle = manifests[0].parent.resolve()
          if not bundle.is_relative_to(root):
              raise SystemExit('SIGNING: artifact path escaped its root')
          for path in bundle.rglob('*'):
              if path.is_symlink():
                  raise SystemExit('SIGNING: symlink in downloaded artifact')
          required = ['SHA256SUMS', 'source-manifest.json', 'validation/librustdesk.so']
          if any(not (bundle / name).is_file() for name in required):
              raise SystemExit('SIGNING: incomplete Android build artifact')
          subprocess.run(['sha256sum', '-c', 'SHA256SUMS'], cwd=bundle, check=True,
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          info = json.loads((bundle / 'build-info.json').read_text())
          source = json.loads((bundle / 'source-manifest.json').read_text())
          expected = {
              'platform': 'android', 'variant': 'standard', 'architecture': arch,
              'package_type': 'debug-signed-apk',
              'signed_status': 'TEST SIGNED / NOT PRODUCTION SIGNED',
              'custom_repository': os.environ['GITHUB_REPOSITORY'],
              'custom_repository_sha': os.environ['GITHUB_SHA'],
              'upstream_sha': os.environ['UPSTREAM_EXPECTED_SHA'],
              'upstream_version': os.environ['UPSTREAM_VERSION'],
              'patchset': os.environ['PATCHSET'],
              'build_run': os.environ['GITHUB_RUN_ID'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
          }
          for key, value in expected.items():
              if str(info.get(key)) != str(value):
                  raise SystemExit('SIGNING: build artifact provenance mismatch: ' + key)
          for key in ('upstream_sha', 'upstream_version', 'patchset', 'custom_repository_sha', 'variant'):
              if source.get(key) != info.get(key):
                  raise SystemExit('SIGNING: prepared source provenance mismatch: ' + key)
          if hashlib.sha256((bundle / 'source-manifest.json').read_bytes()).hexdigest() != info.get('prepared_source_identity'):
              raise SystemExit('SIGNING: prepared source identity checksum mismatch')
          if str(source.get('prepare_workflow_run')) != str(info.get('prepare_run')) or str(info.get('prepare_run')) != str(info.get('build_run')):
              raise SystemExit('SIGNING: build and prepare run mismatch')
          packages = list((bundle / 'packages').glob('*.apk'))
          if len(packages) != 1:
              raise SystemExit('SIGNING: expected exactly one input APK')
          apk = packages[0].resolve()
          if not apk.is_relative_to(bundle):
              raise SystemExit('SIGNING: APK path escaped artifact bundle')
          verify = subprocess.run(['apksigner', 'verify', '--verbose', str(apk)],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if verify.returncode:
              raise SystemExit('SIGNING: input APK signature verification failed')
          badging = subprocess.run(['aapt', 'dump', 'badging', str(apk)],
                                   check=True, capture_output=True, text=True).stdout
          match = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']*)'", badging, re.M)
          if not match or match.group(1) != 'com.carriez.flutter_hbb':
              raise SystemExit('SIGNING: unexpected Android package identity')
          abi = expected_arches[arch]
          with zipfile.ZipFile(apk) as archive:
              native = 'lib/' + abi + '/librustdesk.so'
              if native not in archive.namelist() or archive.read(native) != (bundle / 'validation/librustdesk.so').read_bytes():
                  raise SystemExit('SIGNING: APK ABI does not match validated build output')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('bundle=' + str(bundle) + '\n')
              output.write('apk=' + str(apk) + '\n')
              output.write('unsigned_apk_sha256=' + digest + '\n')
          print('Unsigned APK SHA-256: ' + digest)
          print('Same-run artifact, source, package, ABI and checksum gates: PASS')
          PY
      - name: Non-sensitive production workflow secret-context preflight
        if: inputs.validation_enable_signing != true
        env:
          SECRET_CONTEXT_PROBE_AVAILABLE: ${{ secrets.SECRET_CONTEXT_PROBE != '' }}
          SECRET_CONTEXT_PROBE: ${{ secrets.SECRET_CONTEXT_PROBE }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          printf '%s\n' 'ENVIRONMENT: PASS'
          if [[ "${SECRET_CONTEXT_PROBE_AVAILABLE,,}" == 'true' ]]; then
            printf '%s\n' 'SECRET CONTEXT: PASS'
          else
            printf '%s\n' 'SECRET CONTEXT: FAIL'
            failed=1
          fi
          if [[ -n "${SECRET_CONTEXT_PROBE:-}" ]]; then
            printf '%s\n' 'STEP MAPPING: PASS'
          else
            printf '%s\n' 'STEP MAPPING: FAIL'
            failed=1
          fi
          if bash -c '[[ -n "${SECRET_CONTEXT_PROBE:-}" ]]'; then
            printf '%s\n' 'PROCESS ENVIRONMENT: PASS'
          else
            printf '%s\n' 'PROCESS ENVIRONMENT: FAIL'
            failed=1
          fi
          unset SECRET_CONTEXT_PROBE
          if [[ "$failed" -eq 0 ]]; then
            printf '%s\n' 'PRODUCTION WORKFLOW STRUCTURE: PASS'
          else
            printf '%s\n' 'PRODUCTION WORKFLOW STRUCTURE: FAIL'
            exit 1
          fi
      - name: Production YubiKey signing (explicit one-shot validation gate)
        id: hardware-sign
        if: >-
          inputs.validation_enable_signing == true &&
          github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/android-signing-validation.yml@refs/heads/main' &&
          github.event_name == 'workflow_dispatch'
        env:
          YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
          APK_TO_SIGN: ${{ steps.input.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          if [[ -z "${YUBIKEY_PIV_PIN:-}" ]]; then
            printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: FAIL'
            exit 1
          fi
          printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: PASS'
          signed_dir="$RUNNER_TEMP/rustdesk-yubikey-signing"
          install -d -m 0700 "$signed_dir"
          /usr/local/bin/rustdesk-sign \
            --input "$APK_TO_SIGN" \
            --output "$signed_dir/signed.apk" \
            --pin-source env
          chmod 0600 "$signed_dir/signed.apk"
          printf '%s\n' 'Installed Bridge signing command completed.'
      - name: Verify signer fingerprint and assemble verified artifact
        if: steps.hardware-sign.outcome == 'success'
        id: verify
        env:
          SIGNED_APK: ${{ runner.temp }}/rustdesk-yubikey-signing/signed.apk
          INPUT_BUNDLE: ${{ steps.input.outputs.bundle }}
          UNSIGNED_APK_SHA256: ${{ steps.input.outputs.unsigned_apk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs "$SIGNED_APK" > "$RUNNER_TEMP/apksigner-verify.txt"
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path

          expected_fingerprint = '559c1ede0fbe3a01f29bcac9d0b34bd9691df3562c83e3019a930506fbc7b6f5'
          expected_package = 'com.carriez.flutter_hbb'
          abi_by_arch = {'aarch64': 'arm64-v8a', 'armv7': 'armeabi-v7a', 'x86_64': 'x86_64'}
          arch = os.environ['SIGNING_ARCH']
          output = Path('.work/verified-signed')
          output.mkdir(parents=True, exist_ok=False)
          source = Path(os.environ['INPUT_BUNDLE']).resolve()
          destination = output / source.name
          shutil.copytree(source, destination, symlinks=False)
          info = json.loads((destination / 'build-info.json').read_text())
          signed = Path(os.environ['SIGNED_APK']).resolve()
          result = subprocess.run(['apksigner', 'verify', '--verbose', '--print-certs', str(signed)],
                                  check=True, capture_output=True, text=True)
          certs = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$', result.stdout, re.M)
          if len(certs) != 1 or certs[0].lower() != expected_fingerprint:
              raise SystemExit('SIGNING: signer certificate fingerprint mismatch')
          schemes = [int(value) for value in re.findall(r'^Verified using v([123]) scheme.*: true$', result.stdout, re.M)]
          if not any(scheme in (2, 3) for scheme in schemes):
              raise SystemExit('SIGNING: APK lacks a verified v2 or v3 signature')
          badging = subprocess.run(['aapt', 'dump', 'badging', str(signed)],
                                   check=True, capture_output=True, text=True).stdout
          match = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']*)'", badging, re.M)
          if not match or match.group(1) != expected_package:
              raise SystemExit('SIGNING: signed APK package identity mismatch')
          abi = abi_by_arch[arch]
          with zipfile.ZipFile(signed) as archive:
              native = 'lib/' + abi + '/librustdesk.so'
              if native not in archive.namelist() or archive.read(native) != (destination / 'validation/librustdesk.so').read_bytes():
                  raise SystemExit('SIGNING: signed APK ABI differs from validated build output')
          packages = destination / 'packages'
          for item in packages.iterdir():
              if item.is_dir():
                  shutil.rmtree(item)
              else:
                  item.unlink()
          apk_name = 'standard-android-' + arch + '-signed.apk'
          shutil.copy2(signed, packages / apk_name)
          actual = {
              'certificate_sha256': certs[0].lower(),
              'package_name': match.group(1),
              'version_code': int(match.group(2)),
              'version_name': match.group(3),
              'abis': [abi],
              'apk_sha256': hashlib.sha256(signed.read_bytes()).hexdigest(),
              'signature_verification': 'PASS',
              'signing_schemes': schemes,
          }
          receipt = dict(actual,
              expected_certificate_sha256=expected_fingerprint,
              certificate_match='PASS',
              signing_method='yubikey-piv-9c-pkcs11',
              piv_slot='9C', pkcs11_id='02', key_algorithm='EC', curve='secp384r1',
              unsigned_apk_sha256=os.environ['UNSIGNED_APK_SHA256'],
              workflow_run=os.environ['GITHUB_RUN_ID'],
              custom_repository_sha=os.environ['GITHUB_SHA'],
              legacy_android_signing_identity='NOT RECOVERED / NOT VALIDATED')
          (destination / 'android-signing-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          info.update(signed=True, signing_identity_verified=True,
              certificate_sha256=actual['certificate_sha256'],
              package_name=actual['package_name'], version_code=actual['version_code'],
              version_name=actual['version_name'], signing_schemes=schemes,
              signed_status='PRODUCTION SIGNED / IDENTITY VERIFIED',
              package_type='production-signed-apk', signing_method='yubikey-piv-9c-pkcs11',
              signing_run=os.environ['GITHUB_RUN_ID'],
              legacy_android_signing_identity='NOT RECOVERED / NOT VALIDATED')
          (destination / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          rows=[]
          for path in sorted(destination.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  rows.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.relative_to(destination).as_posix())
          (destination / 'SHA256SUMS').write_text('\n'.join(rows) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output_file:
              output_file.write('certificate_sha256=' + actual['certificate_sha256'] + '\n')
              output_file.write('signed_apk_sha256=' + actual['apk_sha256'] + '\n')
          print('Signer certificate SHA-256: ' + actual['certificate_sha256'])
          print('Signed APK SHA-256: ' + actual['apk_sha256'])
          print('APK signature, fingerprint, package, ABI and provenance gates: PASS')
          PY
      - name: Upload verified signed APK bundle
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-signing-validation-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-standard-android-${{ matrix.arch }}
          path: .work/verified-signed/
          if-no-files-found: error
          retention-days: 14
      - name: Remove downloaded and signed workspace artifacts
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path('.work/android-build-input'), Path('.work/verified-signed'),
                       Path(os.environ['RUNNER_TEMP']) / 'rustdesk-yubikey-signing'):
              if path.exists():
                  shutil.rmtree(path)
          PY
  verify-all:
    if: inputs.validation_enable_signing == true
    needs: [android-sign, resolve, compatibility]
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with: {persist-credentials: false}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: rustdesk-signing-validation-*-standard-android-*
        path: .work/signed-android
    - name: Independent final ABI inventory and all signed bundle gates
      run: |
        sudo apt-get update -y
        sudo apt-get install -y apksigner aapt
        python3 - <<'PY'
        import json,sys
        from pathlib import Path
        sys.path.insert(0,'scripts')
        from platform_package import validate
        root=Path('.work/signed-android')
        results=[validate(p.parent) for p in root.rglob('build-info.json')]
        if len(results)!=1 or {i['architecture'] for i in results}!={'aarch64'}:raise ValueError('Missing/duplicate validation ABI')
        if any(i['signed_status']!='PRODUCTION SIGNED / IDENTITY VERIFIED' for i in results):raise ValueError('Unverified signing identity')
        if len({i['prepared_source_identity'] for i in results})!=1:raise ValueError('Prepared source mismatch')
        if len({i['certificate_sha256'] for i in results})!=1:raise ValueError('Certificate mismatch across ABI')
        from upstream import api
        from production import scan_job_log
        for page in range(1,11):
          jobs=api('repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/actions/runs/'+__import__('os').environ['GITHUB_RUN_ID']+'/jobs?per_page=100&page='+str(page))['jobs']
          for job in jobs:
            if job['status']=='completed' and job['conclusion']=='success':scan_job_log(job['id'])
          if len(jobs)<100:break
        print('Single Android Standard aarch64 production signing identity and visible log credential gates: PASS')
        PY
