name: Direct Environment Secret Visibility Probe
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-probe:
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/secret-context-direct-probe.yml@refs/heads/main'
    name: Check dummy Environment secret visibility
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-secret-context-direct-probe
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - name: Check dummy secret context and step mapping
        env:
          PROBE_CONTEXT_AVAILABLE: ${{ secrets.SECRET_CONTEXT_PROBE != '' }}
          SECRET_CONTEXT_PROBE: ${{ secrets.SECRET_CONTEXT_PROBE }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          if [[ "${PROBE_CONTEXT_AVAILABLE,,}" == 'true' ]]; then
            printf '%s\n' 'DIRECT SECRET CONTEXT: PASS'
          else
            printf '%s\n' 'DIRECT SECRET CONTEXT: FAIL'
            failed=1
          fi

          if [[ -n "${SECRET_CONTEXT_PROBE:-}" ]]; then
            printf '%s\n' 'DIRECT STEP MAPPING: PASS'
          else
            printf '%s\n' 'DIRECT STEP MAPPING: FAIL'
            failed=1
          fi

          if bash -c '[[ -n "${SECRET_CONTEXT_PROBE:-}" ]]'; then
            printf '%s\n' 'DIRECT PROCESS ENVIRONMENT: PASS'
          else
            printf '%s\n' 'DIRECT PROCESS ENVIRONMENT: FAIL'
            failed=1
          fi

          unset SECRET_CONTEXT_PROBE
          if [[ "$failed" -eq 0 ]]; then
            printf '%s\n' 'DIRECT WORKFLOW: PASS'
          else
            printf '%s\n' 'DIRECT WORKFLOW: FAIL'
            exit 1
          fi
