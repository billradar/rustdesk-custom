name: Reusable Wayland Unattended Target
env:
  PYTHONPATH: .
'on':
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      variant:
        type: string
        required: true
      runner:
        type: string
        required: true
      upstream_ref:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      upstream_version:
        type: string
        required: true
      patchset:
        type: string
        required: true
      channel:
        type: string
        required: true
      source_artifact:
        type: string
        required: true
    secrets:
      RUSTDESK_KEY:
        required: true
      RUSTDESK_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  platform-build:
    name: unattended-wayland-${{ inputs.variant }}-${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ inputs.platform }}
      PLATFORM_ARCH: ${{ inputs.arch }}
      VARIANT: ${{ inputs.variant }}
      PATCHSET: ${{ inputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ inputs.upstream_sha }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      BUILD_CHANNEL: ${{ inputs.channel }}
      BUILD_CONFIGURATION: PRODUCTION
      RUSTDESK_ID_SERVER: ${{ vars.RUSTDESK_ID_SERVER }}
      RUSTDESK_RELAY_SERVER: ${{ vars.RUSTDESK_RELAY_SERVER }}
      RUSTDESK_API_SERVER: ${{ vars.RUSTDESK_API_SERVER }}
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      PREPARED_SOURCE_DIR: ${{ github.workspace }}/.work/prepared-input/source
      BUILD_FLAVOR: unattended-wayland
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Isolated reviewed parser environment
      run: |
        python3 -m venv .work/python
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          .work/python/Scripts/python.exe -m pip install -r requirements.txt
          echo "$PWD/.work/python/Scripts" >> "$GITHUB_PATH"
        else
          .work/python/bin/python -m pip install -r requirements.txt
          echo "$PWD/.work/python/bin" >> "$GITHUB_PATH"
        fi
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: ${{ inputs.source_artifact }}
        path: .work/source-bundle
    - id: source
      name: Verify immutable prepared input before native dependencies
      run: |
        [[ "$VARIANT" != sos || "$PLATFORM" == linux || "$PLATFORM" == macos ]] || exit 1
        python3 scripts/source/prepared_source.py unpack --bundle .work/source-bundle --destination .work/prepared-input --variant "$VARIANT" --sha "$UPSTREAM_EXPECTED_SHA" --patchset "$PATCHSET"
    - id: profile
      name: Verify reviewed official target before native dependencies
      env:
        EXPECTED_RUNNER: ${{ inputs.runner }}
      run: |
        python3 scripts/platform/platform_adapter.py "$PREPARED_SOURCE_DIR" --platform "$PLATFORM" --arch "$PLATFORM_ARCH" --output .work/platform-profile.json
        python3 - <<'PY'
        import json,os
        p=json.load(open('.work/platform-profile.json'))
        if p['runner']!=os.environ['EXPECTED_RUNNER']:raise ValueError('BUILD_COMPAT: official runner mismatch')
        PY
    - name: Fail-closed DRM source and native architecture preflight
      run: |
        set -euo pipefail
        [[ "$PLATFORM" == linux && ( "$VARIANT" == standard || "$VARIANT" == sos ) && ( "$BUILD_CHANNEL" == stable || "$BUILD_CHANNEL" == nightly ) ]] || exit 1
        [[ "$(uname -m)" == "$PLATFORM_ARCH" ]] || { echo 'ARCH: native runner required'; exit 1; }
        python3 scripts/platform/wayland.py preflight --tree "$PREPARED_SOURCE_DIR" --arch "$PLATFORM_ARCH" --variant "$VARIANT"
      id: drm
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      id: rust
      with:
        toolchain: ${{ steps.profile.outputs.rust }}
        targets: ${{ steps.profile.outputs.target }}
        components: rustfmt
    - name: Exact-source ARM Linux CMake requirement
      if: inputs.platform == 'linux' && inputs.arch == 'aarch64' && steps.profile.outputs.cmake != ''
      env:
        CMAKE_VERSION: ${{ steps.profile.outputs.cmake }}
      run: |
        python3 -m pip install "cmake==$CMAKE_VERSION"
    - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      id: vcpkg
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ steps.profile.outputs.vcpkg }}
        doNotCache: true
    - name: Official-compatible compile, package and independent gates
      id: build
      env:
        RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
      run: python3 scripts/platform/run_platform.py
    - name: Upload validated target only
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-wayland-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-${{ inputs.variant }}-${{ inputs.arch }}
        path: artifacts/rustdesk-*/
        if-no-files-found: error
        retention-days: 14
    - name: Record early toolchain/infra failures without environment dumps
      if: always()
      env:
        SOURCE_OUTCOME: ${{ steps.source.outcome }}
        PROFILE_OUTCOME: ${{ steps.profile.outcome }}
        RUST_OUTCOME: ${{ steps.rust.outcome }}
        VCPKG_OUTCOME: ${{ steps.vcpkg.outcome }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        DRM_OUTCOME: ${{ steps.drm.outcome }}
      run: |
        python3 - <<'PY'
        import json,os
        from pathlib import Path
        folder=Path('.work/target-diagnostic');folder.mkdir(parents=True,exist_ok=True)
        path=folder/'diagnostic.json'
        if not path.exists():
            keys=[('SOURCE_OUTCOME','PROVENANCE'),('PROFILE_OUTCOME','BUILD_COMPAT'),('RUST_OUTCOME','TOOLCHAIN'),('DRM_OUTCOME','BUILD_COMPAT'),('VCPKG_OUTCOME','DEPENDENCY')]
            failed=next(((k,c) for k,c in keys if os.environ.get(k)=='failure'),('UNKNOWN','INFRASTRUCTURE'))
            path.write_text(json.dumps({'target':os.environ['PLATFORM']+'-'+os.environ['PLATFORM_ARCH']+'-'+os.environ['VARIANT'],'result':'FAIL','failure_category':failed[1],'failed_step':failed[0],'upstream_sha':os.environ['UPSTREAM_EXPECTED_SHA'],'build_run':os.environ['GITHUB_RUN_ID']},indent=2)+'\n')
        elif os.environ.get('UPLOAD_OUTCOME')=='failure':
            data=json.loads(path.read_text());data.update(result='FAIL',failure_category='INFRASTRUCTURE',failed_step='UPLOAD');path.write_text(json.dumps(data,indent=2)+'\n')
        PY
    - name: Preserve target diagnostic, never a failed client bundle
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: diagnostic-wayland-${{ inputs.variant }}-${{ inputs.arch }}-${{ github.run_id }}
        path: .work/target-diagnostic/
        if-no-files-found: warn
        retention-days: 14
