name: Upstream Nightly Router
'on':
  schedule:
    # Stagger from Stable's hourly 11-minute check; GitHub schedules may lag.
    - cron: '41 * * * *'
    # Two offset recovery probes in case an hourly tick is dropped.
    - cron: '17 7,19 * * *'
  workflow_dispatch:
    inputs:
      force_retry:
        type: boolean
        default: false
        description: Bypass 6-hour cooldown for a manual retry only; all other gates remain
permissions:
  contents: read
  actions: read
concurrency:
  group: upstream-nightly-router
  cancel-in-progress: false
jobs:
  route:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      PYTHONPATH: .
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements.txt
    - name: Follow successful official run and deduplicate exact custom revision
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE_RETRY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_retry && 'true' || 'false' }}
        ANDROID_PRODUCTION_SIGNING_ENABLED: ${{ vars.ANDROID_PRODUCTION_SIGNING_ENABLED || 'false' }}
      run: python3 scripts/release/nightly.py route
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: nightly-route-${{ github.run_id }}
        path: .work/nightly-discovery.json
        if-no-files-found: warn
