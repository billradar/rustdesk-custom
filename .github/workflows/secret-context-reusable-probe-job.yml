name: Reusable Secret Context Matrix Job
'on':
  workflow_call:
    secrets:
      SECRET_CONTEXT_PROBE:
        required: false
      SECRET_CONTEXT_PROBE_2:
        required: true
permissions:
  contents: read
jobs:
  reusable-probe:
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/secret-context-reusable-probe.yml@refs/heads/main'
    name: Check Environment and explicit workflow_call secret paths
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-secret-context-reusable-probe
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - name: Check dummy Environment and workflow_call secret paths
        env:
          ENVIRONMENT_PROBE_CONTEXT_AVAILABLE: ${{ secrets.SECRET_CONTEXT_PROBE != '' }}
          SECRET_CONTEXT_PROBE: ${{ secrets.SECRET_CONTEXT_PROBE }}
          CALLER_PROBE_CONTEXT_AVAILABLE: ${{ secrets.SECRET_CONTEXT_PROBE_2 != '' }}
          SECRET_CONTEXT_PROBE_2: ${{ secrets.SECRET_CONTEXT_PROBE_2 }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          environment_path_failed=0
          caller_path_failed=0

          if [[ "${ENVIRONMENT_PROBE_CONTEXT_AVAILABLE,,}" == 'true' ]]; then
            printf '%s\n' 'REUSABLE ENV SECRET CONTEXT: PASS'
          else
            printf '%s\n' 'REUSABLE ENV SECRET CONTEXT: FAIL'
            failed=1
            environment_path_failed=1
          fi
          if [[ -n "${SECRET_CONTEXT_PROBE:-}" ]]; then
            printf '%s\n' 'REUSABLE ENV STEP MAPPING: PASS'
          else
            printf '%s\n' 'REUSABLE ENV STEP MAPPING: FAIL'
            failed=1
            environment_path_failed=1
          fi
          if bash -c '[[ -n "${SECRET_CONTEXT_PROBE:-}" ]]'; then
            printf '%s\n' 'REUSABLE ENV PROCESS ENVIRONMENT: PASS'
          else
            printf '%s\n' 'REUSABLE ENV PROCESS ENVIRONMENT: FAIL'
            failed=1
            environment_path_failed=1
          fi
          if [[ "$environment_path_failed" -eq 0 ]]; then
            printf '%s\n' 'REUSABLE ENVIRONMENT SECRET PATH: PASS'
          else
            printf '%s\n' 'REUSABLE ENVIRONMENT SECRET PATH: FAIL'
          fi

          if [[ "${CALLER_PROBE_CONTEXT_AVAILABLE,,}" == 'true' ]]; then
            printf '%s\n' 'WORKFLOW_CALL SECRET CONTEXT: PASS'
          else
            printf '%s\n' 'WORKFLOW_CALL SECRET CONTEXT: FAIL'
            failed=1
            caller_path_failed=1
          fi
          if [[ -n "${SECRET_CONTEXT_PROBE_2:-}" ]]; then
            printf '%s\n' 'WORKFLOW_CALL STEP MAPPING: PASS'
          else
            printf '%s\n' 'WORKFLOW_CALL STEP MAPPING: FAIL'
            failed=1
            caller_path_failed=1
          fi
          if bash -c '[[ -n "${SECRET_CONTEXT_PROBE_2:-}" ]]'; then
            printf '%s\n' 'WORKFLOW_CALL PROCESS ENVIRONMENT: PASS'
          else
            printf '%s\n' 'WORKFLOW_CALL PROCESS ENVIRONMENT: FAIL'
            failed=1
            caller_path_failed=1
          fi
          if [[ "$caller_path_failed" -eq 0 ]]; then
            printf '%s\n' 'WORKFLOW_CALL SECRET PATH: PASS'
          else
            printf '%s\n' 'WORKFLOW_CALL SECRET PATH: FAIL'
          fi

          unset SECRET_CONTEXT_PROBE SECRET_CONTEXT_PROBE_2
          if [[ "$failed" -eq 0 ]]; then
            printf '%s\n' 'REUSABLE WORKFLOW: PASS'
          else
            printf '%s\n' 'REUSABLE WORKFLOW: FAIL'
            exit 1
          fi
