name: Reusable Cross-Platform Build Core
'on':
  workflow_call:
    inputs:
      upstream_repository:
        type: string
        default: rustdesk/rustdesk
      upstream_ref:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      channel:
        type: string
        required: true
      patchset:
        type: string
        required: true
      upstream_version:
        type: string
        required: true
      standard_artifact:
        type: string
        required: true
      sos_artifact:
        type: string
        required: true
      revision:
        type: string
        default: '1'
      include_experimental:
        type: boolean
        default: false
      production_android_signing:
        type: boolean
        default: false
      direct_android_signing:
        type: boolean
        default: false
      android_only:
        type: boolean
        default: false
      desktop_only:
        type: boolean
        default: false
    secrets:
      RUSTDESK_KEY:
        required: true
      RUSTDESK_PASSWORD:
        required: true
permissions:
  contents: read
  actions: read
env:
  AUTOMATION_MODE: '1'
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      android_matrix: ${{ steps.split.outputs.android_matrix }}
      android_count: ${{ steps.split.outputs.android_count }}
      other_platform_matrix: ${{ steps.split.outputs.other_platform_matrix }}
      other_platform_count: ${{ steps.split.outputs.other_platform_count }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - id: plan
      env:
        CHANNEL: ${{ inputs.channel }}
        EXPERIMENTAL: ${{ inputs.include_experimental }}
      run: 'args=(); [[ "$EXPERIMENTAL" != true ]] || args+=(--experimental)

        python3 scripts/phase5.py plan --channel "$CHANNEL" "${args[@]}"'
    - id: split
      name: Split Android and other platform target matrices
      run: |
        android_matrix=$(jq -c '{include: [.selected[] | select(.platform == "android")]}' .work/target-plan.json)
        android_count=$(jq '[.selected[] | select(.platform == "android")] | length' .work/target-plan.json)
        other_platform_matrix=$(jq -c '{include: [.selected[] | select(.platform != "android" and .platform != "windows")]}' .work/target-plan.json)
        other_platform_count=$(jq '[.selected[] | select(.platform != "android" and .platform != "windows")] | length' .work/target-plan.json)
        echo "android_matrix=$android_matrix" >> "$GITHUB_OUTPUT"
        echo "android_count=$android_count" >> "$GITHUB_OUTPUT"
        echo "other_platform_matrix=$other_platform_matrix" >> "$GITHUB_OUTPUT"
        echo "other_platform_count=$other_platform_count" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: target-plan-${{ github.run_id }}
        path: .work/target-plan.json
        if-no-files-found: error
  build:
    if: inputs.android_only != true
    name: build/windows-${{ matrix.variant }}
    env:
      PATCHSET: ${{ inputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ inputs.upstream_sha }}
      UPSTREAM_TAG: ${{ inputs.channel == 'stable' && inputs.upstream_ref || '' }}
      PATCH_REVISION: ${{ inputs.revision }}
      BUILD_CONFIGURATION: PRODUCTION
      RUSTDESK_ID_SERVER: ${{ vars.RUSTDESK_ID_SERVER }}
      RUSTDESK_RELAY_SERVER: ${{ vars.RUSTDESK_RELAY_SERVER }}
      RUSTDESK_API_SERVER: ${{ vars.RUSTDESK_API_SERVER }}
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      BUILD_CHANNEL: ${{ inputs.channel }}
      UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      ARTIFACT_IDENTITY: ${{ inputs.channel == 'nightly' && format('nightly-{0}-{1}', inputs.upstream_version, inputs.upstream_sha)
        || inputs.upstream_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: windows
          arch: x86_64
          variant: standard
          runner: windows-2022
          enabled: true
          support_status: SUPPORTED
          upstream_build_profile: windows-flutter-x64
        - platform: windows
          arch: x86_64
          variant: sos
          runner: windows-2022
          enabled: true
          support_status: SUPPORTED
          upstream_build_profile: windows-flutter-x64
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements-build.txt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: ${{ matrix.variant == 'standard' && inputs.standard_artifact || inputs.sos_artifact }}
        path: .work/source-bundle
    - id: profile
      name: Verify immutable prepared source before any dependency build
      env:
        VARIANT: ${{ matrix.variant }}
      run: 'python3 scripts/prepared_source.py unpack --bundle .work/source-bundle --destination .work/prepared-input --variant
        "$VARIANT" --sha "$UPSTREAM_EXPECTED_SHA" --patchset "$PATCHSET"

        python3 scripts/build_adapter.py .work/prepared-input/source --output .work/build-profile.json'
    - name: Validate production inputs without printing values
      env:
        RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
      run: python3 scripts/production_config.py inputs
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: test-bridge-${{ github.run_id }}
        path: .work/bridge-files
    - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ steps.profile.outputs.llvm }}
    - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        flutter-version: ${{ steps.profile.outputs.flutter }}
        channel: stable
        architecture: x64
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ steps.profile.outputs.rust }}
        targets: x86_64-pc-windows-msvc
        components: rustfmt
    - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
    - name: Prepare upstream dependency recipes
      run: echo "Dependency recipes are from verified Prepared Source"
    - name: Install the official custom Flutter engine
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        flutter precache --windows

        if ($LASTEXITCODE -ne 0) { throw ''flutter precache failed'' }

        $sdk = Split-Path (Split-Path (Get-Command flutter).Source)

        $engine = Join-Path $sdk ''bin/cache/artifacts/engine/windows-x64-release''

        Invoke-WebRequest https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile .work/engine.zip

        Expand-Archive .work/engine.zip .work/engine

        Copy-Item .work/engine/* $engine -Recurse -Force

        $hash = (Get-FileHash .work/engine.zip -Algorithm SHA256).Hash.ToLowerInvariant()

        "ENGINE_ARCHIVE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        Write-Output "Official engine SHA256: $hash"

        '
    - name: Apply official Flutter SDK dropdown patch
      run: 'sdk=$(dirname "$(dirname "$(command -v flutter)")")

        patch="$PWD/.work/prepared-input/source/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

        git -C "$sdk" apply --check "$patch"

        git -C "$sdk" apply "$patch"

        '
    - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ steps.profile.outputs.vcpkg }}
        doNotCache: true
    - name: Install official vcpkg dependencies
      working-directory: .work/prepared-input/source
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      run: '"$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"'
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: windows-helper-${{ github.run_id }}
        path: .work/topmost
    - name: Verify shared helper provenance and digest
      shell: bash
      env:
        HELPER_SHA: ${{ steps.profile.outputs.helper_commit }}
      run: "python3 - <<'PYCODE'\nimport hashlib,json,os,struct\nfrom pathlib import Path\nroot=Path('.work/topmost');info=json.loads((root/'helper-info.json').read_text())\n\
        for key,value in [('upstream_sha',os.environ['UPSTREAM_EXPECTED_SHA']),('helper_commit',os.environ['HELPER_SHA']),('architecture','x86_64'),('workflow_run',os.environ['GITHUB_RUN_ID'])]:\n\
        \ if info[key]!=value:raise ValueError('Shared helper identity mismatch: '+key)\nb=(root/'WindowInjection/x64/Release/WindowInjection.dll').read_bytes()\n\
        if hashlib.sha256(b).hexdigest()!=info['sha256']:raise ValueError('Shared helper checksum mismatch')\noff=struct.unpack_from('<I',b,0x3c)[0]\n\
        if b[:2]!=b'MZ' or b[off:off+4]!=b'PE\\0\\0' or struct.unpack_from('<H',b,off+4)[0]!=0x8664:raise ValueError('Shared\
        \ helper is not AMD64')\nprint('Shared helper checksum/architecture/source: PASS')\nPYCODE\n"
    - name: Build and verify selected variant
      env:
        UPSTREAM_REF: ${{ inputs.upstream_sha }}
        VARIANT: ${{ matrix.variant }}
        RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
      run: 'export PREPARED_SOURCE_DIR="$PWD/.work/prepared-input/source"

        export RUSTDESK_BRIDGE_DIR="$(cygpath -w "$PWD/.work/bridge-files")"

        export RUSTDESK_TOPMOST_DLL="$(cygpath -w "$PWD/.work/topmost/WindowInjection/x64/Release/WindowInjection.dll")"

        bash "scripts/build-$VARIANT.sh" "$UPSTREAM_REF"

        '
    - name: Upload verified production bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-${{ inputs.channel }}-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-${{ matrix.variant
          }}-windows-x86_64
        path: artifacts/rustdesk-*-${{ matrix.variant }}-windows-x86_64/
        if-no-files-found: error
        retention-days: 14
    needs: plan
  android-signing-preflight:
    needs: plan
    if: inputs.desktop_only != true && inputs.android_only != true && inputs.production_android_signing
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with: {persist-credentials: false}
    - name: Verify public YubiKey identity before expensive builds
      if: inputs.production_android_signing
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        info = json.loads(Path('metadata/yubikey-android-signing-identity.json').read_text())
        assert info['certificate_sha256'] == '559c1ede0fbe3a01f29bcac9d0b34bd9691df3562c83e3019a930506fbc7b6f5'
        assert info['piv_slot'] == '9C' and info['pkcs11_id'] == '02'
        print('YubiKey identity metadata: PASS')
        PY

  platforms:
    needs: [plan, android-signing-preflight]
    if: inputs.android_only != true && inputs.desktop_only != true && needs.plan.outputs.other_platform_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.other_platform_matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      variant: ${{ matrix.variant }}
      runner: ${{ matrix.runner }}
      upstream_ref: ${{ inputs.upstream_ref }}
      upstream_sha: ${{ inputs.upstream_sha }}
      upstream_version: ${{ inputs.upstream_version }}
      patchset: ${{ inputs.patchset }}
      channel: ${{ inputs.channel }}
      production_signing: false
      source_artifact: ${{ matrix.variant == 'standard' && inputs.standard_artifact || inputs.sos_artifact }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  android-platforms:
    needs: [plan, android-signing-preflight]
    if: inputs.desktop_only != true && needs.plan.outputs.android_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.android_matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      variant: ${{ matrix.variant }}
      runner: ${{ matrix.runner }}
      upstream_ref: ${{ inputs.upstream_ref }}
      upstream_sha: ${{ inputs.upstream_sha }}
      upstream_version: ${{ inputs.upstream_version }}
      patchset: ${{ inputs.patchset }}
      channel: ${{ inputs.channel }}
      production_signing: false
      source_artifact: ${{ matrix.variant == 'standard' && inputs.standard_artifact || inputs.sos_artifact }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  validate:
    if: inputs.android_only != true && inputs.desktop_only != true
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET: ${{ inputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ inputs.upstream_sha }}
      UPSTREAM_TAG: ${{ inputs.channel == 'stable' && inputs.upstream_ref || '' }}
      BUILD_CONFIGURATION: PRODUCTION
      CHANNEL: ${{ inputs.channel }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements-build.txt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-*-windows-x86_64
        path: .work/collected
        merge-multiple: false
    - name: Verify paired prepared-source provenance, production config, checksum and architecture
      run: python3 scripts/phase4.py validate --channel "$CHANNEL"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: channel-validation-${{ github.run_id }}
        path: '.work/channel-validation.json

          .work/production-release-assets/'
        if-no-files-found: error
  aggregate:
    needs:
    - plan
    - build
    - validate
    - platforms
    - android-platforms
    if: >-
      inputs.android_only != true &&
      inputs.desktop_only != true &&
      always() &&
      needs.plan.result == 'success'
    runs-on: ubuntu-22.04
    env:
      PATCHSET: ${{ inputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ inputs.upstream_sha }}
      BUILD_CONFIGURATION: PRODUCTION
      CHANNEL: ${{ inputs.channel }}
      EXPERIMENTAL: ${{ inputs.include_experimental }}
      REQUIRE_ANDROID_PRODUCTION_SIGNING: ${{ inputs.production_android_signing }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements-build.txt
    - name: Package inspectors
      run: 'sudo apt-get update -y

        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt'
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-${{ inputs.channel }}-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-*
        path: .work/all-targets
        merge-multiple: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      if: inputs.include_experimental
      with:
        pattern: diagnostic-*
        path: .work/all-targets/diagnostics
        merge-multiple: false
    - name: Fail-closed expected target and cross-platform provenance gate
      run: 'args=(); [[ "$EXPERIMENTAL" != true ]] || args+=(--experimental)

        python3 scripts/phase5.py aggregate --channel "$CHANNEL" "${args[@]}"'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: platform-aggregate-${{ github.run_id }}
        path: .work/phase5-aggregate/
        if-no-files-found: warn
