name: Reusable Wayland Unattended Build
env:
  PYTHONPATH: .
'on':
  workflow_call:
    inputs:
      upstream_ref:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      upstream_version:
        type: string
        required: true
      patchset:
        type: string
        required: true
      channel:
        type: string
        required: true
      standard_artifact:
        type: string
        required: true
      sos_artifact:
        type: string
        required: true
    secrets:
      RUSTDESK_KEY:
        required: true
      RUSTDESK_PASSWORD:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          variant: standard
          runner: ubuntu-22.04
        - arch: aarch64
          variant: standard
          runner: ubuntu-22.04-arm
        - arch: x86_64
          variant: sos
          runner: ubuntu-22.04
        - arch: aarch64
          variant: sos
          runner: ubuntu-22.04-arm
    uses: ./.github/workflows/build-wayland-target.yml
    with:
      platform: linux
      arch: ${{ matrix.arch }}
      variant: ${{ matrix.variant }}
      runner: ${{ matrix.runner }}
      upstream_ref: ${{ inputs.upstream_ref }}
      upstream_sha: ${{ inputs.upstream_sha }}
      upstream_version: ${{ inputs.upstream_version }}
      patchset: ${{ inputs.patchset }}
      channel: ${{ inputs.channel }}
      source_artifact: ${{ matrix.variant == 'sos' && inputs.sos_artifact || inputs.standard_artifact }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  aggregate:
    needs: build
    runs-on: ubuntu-22.04
    env:
      UPSTREAM_EXPECTED_SHA: ${{ inputs.upstream_sha }}
      UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      PATCHSET: ${{ inputs.patchset }}
      BUILD_CHANNEL: ${{ inputs.channel }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements.txt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-wayland-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-*
        path: .work/wayland-targets
        merge-multiple: false
    - name: All four targets, package and exact provenance gate
      run: python3 scripts/platform/wayland.py aggregate --root .work/wayland-targets --output .work/wayland-qualification.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: wayland-qualification-${{ github.run_id }}
        path: .work/wayland-qualification.json
        if-no-files-found: error
