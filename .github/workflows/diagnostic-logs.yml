name: Unified diagnostic logs compatibility
'on':
  pull_request:
    paths:
    - patchsets/v3/**
    - scripts/validation/diagnostic_logs.py
    - scripts/validation/dependency_inventories.py
    - scripts/validation/fixtures/api-failover/**
    - scripts/validation/fixtures/diagnostic-logs/**
    - .github/workflows/diagnostic-logs.yml
permissions:
  contents: read
jobs:
  diagnostics:
    name: Diagnostic storage (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, windows-2022, macos-26-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: .
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/diagnostic-target
    steps:
    - name: Preserve patch bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: '1.75.0'
        components: rustfmt, clippy
    - name: Apply v3 to exact upstream source
      run: |
        set -euo pipefail
        python3 -m pip install -r requirements.txt
        git clone --depth 1 --branch 1.5.3 https://github.com/rustdesk/rustdesk.git .work/log-source
        test "$(git -C .work/log-source rev-parse HEAD)" = 95cca3f661f635b3cc85c04935fe8d96d8f432ef
        git -C .work/log-source submodule update --init --depth 1 libs/hbb_common
        PATCHSET=v3 BUILD_CHANNEL=ci bash scripts/source/apply_patches.sh .work/log-source standard
    - name: Install Android standard libraries for core-only checks
      if: matrix.runner == 'ubuntu-22.04'
      run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    - name: Resolve static Cargo dependency inventories
      run: python3 scripts/validation/dependency_inventories.py
    - name: Test actual diagnostic engine and sanitized adapters
      run: |
        set -euo pipefail
        if [ '${{ matrix.runner }}' = 'ubuntu-22.04' ]; then
          python3 scripts/validation/diagnostic_logs.py --source .work/log-source --output .work/diagnostic-results.json --targets aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        else
          python3 scripts/validation/diagnostic_logs.py --source .work/log-source --output .work/diagnostic-results.json
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: diagnostic-results-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .work/diagnostic-results.json
        if-no-files-found: warn
