name: Reusable Android Environment Secret Delivery Probe
'on':
  workflow_call:
permissions:
  contents: read
jobs:
  environment-pin-probe:
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/android-signing-secret-probe.yml@refs/heads/main'
    name: Check Environment secret availability only
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-yubikey-secret-probe
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - name: Check Environment PIN availability without using it
        env:
          PIN_SECRET_CONTEXT_AVAILABLE: ${{ secrets.YUBIKEY_PIV_PIN != '' }}
          YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          if [[ "${PIN_SECRET_CONTEXT_AVAILABLE,,}" == 'true' ]]; then
            printf '%s\n' 'SECRETS CONTEXT: PASS'
          else
            printf '%s\n' 'SECRETS CONTEXT: FAIL'
            failed=1
          fi

          if [[ -n "${YUBIKEY_PIV_PIN:-}" ]]; then
            printf '%s\n' 'STEP ENV MAPPING: PASS'
          else
            printf '%s\n' 'STEP ENV MAPPING: FAIL'
            failed=1
          fi

          if bash -c '[[ -n "${YUBIKEY_PIV_PIN:-}" ]]'; then
            printf '%s\n' 'PROCESS ENVIRONMENT: PASS'
            printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: PASS'
          else
            printf '%s\n' 'PROCESS ENVIRONMENT: FAIL'
            printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: FAIL'
            failed=1
          fi

          unset YUBIKEY_PIV_PIN
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
