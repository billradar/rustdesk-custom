name: Nightly - Development artifacts
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        description: Upstream ref; empty = official default branch
        default: ''
      force_rebuild:
        type: boolean
        description: Rebuild even if this upstream revision was already validated
        default: false
      include_experimental:
        type: boolean
        default: true
        description: Include experimental Linux/macOS/Android targets; never promote automatically
      release_mode:
        type: choice
        description: Nightly publication mode; release is forbidden
        options:
          - build
          - draft
        default: build
permissions:
  contents: read
  actions: read
concurrency:
  group: phase4-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      build_needed: ${{ steps.resolve.outputs.build_needed }}
      draft_needed: ${{ steps.resolve.outputs.draft_needed }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
        CHANNEL: nightly
        FORCE: ${{ inputs.force_rebuild || false }}
      run: 'args=()

        [[ "$FORCE" != true ]] || args+=(--force)

        python3 scripts/phase4.py resolve --channel "$CHANNEL" --ref "$REQUESTED_REF" "${args[@]}"'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  compatibility:
    needs: resolve
    uses: ./.github/workflows/compat-check.yml
    with:
      upstream_repository: rustdesk/rustdesk
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: nightly
    if: needs.resolve.outputs.build_needed == 'true'
  prepare:
    needs:
    - resolve
    - compatibility
    uses: ./.github/workflows/prepare-source.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: nightly
      patchset: ${{ needs.compatibility.outputs.patchset }}
  build:
    needs:
    - resolve
    - compatibility
    - prepare
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: nightly
      patchset: ${{ needs.compatibility.outputs.patchset }}
      upstream_version: ${{ needs.prepare.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
      revision: ${{ needs.resolve.outputs.revision }}
      production_android_signing: true
      include_experimental: ${{ github.event_name == 'schedule' || inputs.include_experimental }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

  android-sign:
    name: Sign Nightly Android artifacts with YubiKey PIV 9C
    needs: [resolve, compatibility, prepare, build]
    if: needs.build.result == 'success'
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-yubikey-signing
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |
          metadata/yubikey-android-signing-identity.json
          scripts/android_yubikey_sign.py
          .github/actions/android-yubikey-sign/action.yml
        sparse-checkout-cone-mode: false
        fetch-depth: 1
    - name: Validate public YubiKey identity metadata
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        info=json.loads(Path("metadata/yubikey-android-signing-identity.json").read_text())
        assert info["certificate_sha256"] == "559c1ede0fbe3a01f29bcac9d0b34bd9691df3562c83e3019a930506fbc7b6f5"
        assert info["piv_slot"] == "9C" and info["pkcs11_id"] == "02"
        print("YubiKey identity metadata: PASS")
        PY
    - name: Environment Secret Binding Preflight
      env:
        YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
      run: |
        set -euo pipefail
        test -n "${YUBIKEY_PIV_PIN:-}"
        echo "ENVIRONMENT PIN AVAILABLE: PASS"
    - name: Nightly Android production signing
      uses: ./.github/actions/android-yubikey-sign
      env:
        YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
      with:
        arches: aarch64,armv7,x86_64
        channel: nightly
        upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
        upstream_version: ${{ needs.prepare.outputs.upstream_version }}
        patchset: ${{ needs.compatibility.outputs.patchset }}
  aggregate:
    name: Aggregate Nightly artifacts
    needs: [resolve, compatibility, prepare, build, android-sign]
    if: needs.build.result == 'success' && needs.android-sign.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      BUILD_CONFIGURATION: NIGHTLY
      CHANNEL: nightly
      EXPERIMENTAL: 'true'
      REQUIRE_ANDROID_PRODUCTION_SIGNING: 'true'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements-build.txt
    - name: Package inspectors
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-nightly-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - name: Fail-closed expected target and cross-platform provenance gate
      run: python3 scripts/phase5.py aggregate --channel nightly --experimental
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: nightly-aggregate-${{ github.run_id }}
        path: .work/phase5-aggregate/
        if-no-files-found: warn

  draft:
    name: Create Nightly Draft Release
    needs: [resolve, compatibility, prepare, build, android-sign, aggregate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_mode == 'draft' &&
      needs.build.result == 'success' &&
      needs.aggregate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_ref }}
      BUILD_CONFIGURATION: NIGHTLY
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements-build.txt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-nightly-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - name: Package inspectors
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - name: Create Nightly Draft Release
      run: python3 scripts/phase5.py draft --channel nightly --root .work/collected
