name: Nightly - Development artifacts
run-name: Nightly ${{ inputs.upstream_ref || 'configured-test-ref' }} / ${{ inputs.release_mode }}
env:
  PYTHONPATH: .
'on':
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        description: Official upstream ref; empty = configured official test ref
        default: ''
      include_experimental:
        type: boolean
        default: true
        description: Include experimental Linux/macOS/Android targets; never promote automatically
      release_mode:
        type: choice
        description: Nightly publication mode; release is forbidden
        options:
          - build
          - draft
        default: build
      automation_source:
        type: string
        description: Internal source marker for Action-created Nightly
        default: manual
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.automation_source == 'upstream-event-router' && 'action-created-ci-nightly' || format('normal-nightly-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.automation_source != 'upstream-event-router' }}

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      build_needed: ${{ steps.resolve.outputs.build_needed }}
      draft_needed: ${{ steps.resolve.outputs.draft_needed }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        UPSTREAM_TEST_REF: ${{ vars.UPSTREAM_TEST_REF || vars.UPSTREAM_TEST_BRANCH || 'test' }}
        CHANNEL: nightly
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
          REQUESTED_REF="$UPSTREAM_TEST_REF"
        else
          REQUESTED_REF="${{ inputs.upstream_ref }}"
          REQUESTED_REF="${REQUESTED_REF:-$UPSTREAM_TEST_REF}"
        fi

        echo "Nightly official upstream ref: $REQUESTED_REF"
        python3 scripts/release/channel.py resolve --channel "$CHANNEL" --ref "$REQUESTED_REF"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  compatibility:
    needs: resolve
    uses: ./.github/workflows/compat-check.yml
    with:
      upstream_repository: rustdesk/rustdesk
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: nightly
    if: needs.resolve.outputs.build_needed == 'true'
  prepare:
    needs:
    - resolve
    - compatibility
    uses: ./.github/workflows/prepare-source.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: nightly
      patchset: ${{ needs.compatibility.outputs.patchset }}
  build:
    needs:
    - resolve
    - compatibility
    - prepare
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: nightly
      patchset: ${{ needs.compatibility.outputs.patchset }}
      upstream_version: ${{ needs.prepare.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
      revision: ${{ needs.resolve.outputs.revision }}
      include_experimental: ${{ github.event_name == 'schedule' || inputs.include_experimental }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

  aggregate:
    name: Aggregate Nightly artifacts
    needs: [resolve, compatibility, prepare, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      BUILD_CONFIGURATION: NIGHTLY
      CHANNEL: nightly
      EXPERIMENTAL: ${{ github.event_name == 'schedule' || inputs.include_experimental }}
      REQUIRE_ANDROID_PRODUCTION_SIGNING: 'false'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements.txt
    - name: Package inspectors
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-nightly-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - name: Fail-closed expected target and cross-platform provenance gate
      run: |
        args=()
        [[ "$EXPERIMENTAL" != true ]] || args+=(--experimental)
        python3 scripts/release/qualification.py aggregate --channel nightly "${args[@]}"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: nightly-aggregate-${{ github.run_id }}
        path: .work/aggregate/
        if-no-files-found: warn

  draft:
    name: Create Nightly Draft Release
    needs: [resolve, compatibility, prepare, build, aggregate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_mode == 'draft' &&
      needs.build.result == 'success' &&
      needs.aggregate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_ref }}
      BUILD_CONFIGURATION: NIGHTLY
      EXPERIMENTAL: ${{ inputs.include_experimental }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements.txt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-nightly-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - name: Package inspectors
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - name: Create Nightly Draft Release
      run: |
        args=()
        [[ "$EXPERIMENTAL" != true ]] || args+=(--experimental)
        python3 scripts/release/qualification.py draft --channel nightly --root .work/collected "${args[@]}"
