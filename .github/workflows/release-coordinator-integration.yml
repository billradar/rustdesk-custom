name: Isolated coordinator Git API verification
'on':
  pull_request:
    paths:
      - '.github/workflows/release-coordinator-integration.yml'
      - 'scripts/release/coordinator/**'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: coordinator-integration-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  isolated-state-writer:
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.head_ref == 'coordinator/06-isolated-api-validation-20261102') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        github.workflow_ref == format('{0}/.github/workflows/release-coordinator-integration.yml@refs/heads/main', github.repository)))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify isolated Git storage races and injected failures
        env:
          GH_TOKEN: ${{ github.token }}
          COORDINATOR_INTEGRATION_ALLOW_WRITE: 'true'
        run: python3 -m scripts.release.coordinator.integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coordinator-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/coordinator-integration/summary.json
          if-no-files-found: warn
