name: Build reliability and targeted recovery
'on':
  workflow_run:
    workflows: [Stable Release Pipeline, Nightly Build Pipeline, CI - Patch and Build compatibility]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: build-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.event.workflow_run.name != 'CI - Patch and Build compatibility' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_INFRA_AUTO_RETRY_ENABLED: ${{ vars.BUILD_INFRA_AUTO_RETRY_ENABLED || 'true' }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: main
        persist-credentials: false
    - name: Record scheduling and recover one infrastructure target
      run: python3 scripts/validation/build_reliability.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: build-reliability-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}
        path: .work/build-reliability/
        if-no-files-found: error
        retention-days: 30
  ci-dashboard:
    if: >-
      github.event.workflow_run.name == 'CI - Patch and Build compatibility' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: main
        persist-credentials: false
    - name: Render completed CI dashboard without recovery permissions
      run: python3 -m scripts.validation.summary_dashboard
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: ci-dashboard-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}
        path: .work/dashboard/
        if-no-files-found: warn
        retention-days: 30
