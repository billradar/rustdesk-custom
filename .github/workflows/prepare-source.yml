name: Reusable Prepared Source
env:
  PYTHONPATH: .
'on':
  workflow_call:
    inputs:
      client_release_identity:
        type: boolean
        default: false
      patch_revision:
        type: string
        default: ''
      build_wayland:
        type: boolean
        default: false
      upstream_repository:
        type: string
        default: rustdesk/rustdesk
      upstream_ref:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      channel:
        type: string
        required: true
      patchset:
        type: string
        required: true
    outputs:
      standard_artifact:
        value: ${{ jobs.prepare.outputs.standard_artifact }}
      sos_artifact:
        value: ${{ jobs.prepare.outputs.sos_artifact }}
      upstream_version:
        value: ${{ jobs.prepare.outputs.upstream_version }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      standard_artifact: ${{ steps.identity.outputs.standard_artifact }}
      sos_artifact: ${{ steps.identity.outputs.sos_artifact }}
      upstream_version: ${{ steps.identity.outputs.upstream_version }}
    env:
      PATCHSET: ${{ inputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ inputs.upstream_sha }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      BUILD_CHANNEL: ${{ inputs.channel }}
      CLIENT_PATCH_REVISION: ${{ inputs.patch_revision }}
      BRANDING_INPUT_PATH: .work/branding-input.json
      CLIENT_RELEASE_IDENTITY: ${{ inputs.client_release_identity && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Verify current coordinator worker admission
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (github.workflow == 'Nightly Build Pipeline' || github.workflow == 'Stable Release Pipeline')
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -m scripts.release.coordinator.runtime guard
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - name: Freeze public branding variables with defaults
      env:
        CUSTOM_DISPLAY_NAME: ${{ vars.CUSTOM_DISPLAY_NAME || '' }}
        CUSTOM_ABOUT_TITLE: ${{ vars.CUSTOM_ABOUT_TITLE || '' }}
        CUSTOM_ANDROID_APP_LABEL: ${{ vars.CUSTOM_ANDROID_APP_LABEL || '' }}
        CUSTOM_ANDROID_SERVICE_LABEL: ${{ vars.CUSTOM_ANDROID_SERVICE_LABEL || '' }}
        CUSTOM_LINUX_APP_LABEL: ${{ vars.CUSTOM_LINUX_APP_LABEL || '' }}
        CUSTOM_DESCRIPTION: ${{ vars.CUSTOM_DESCRIPTION || '' }}
        CUSTOM_SLOGAN: ${{ vars.CUSTOM_SLOGAN || '' }}
        CUSTOM_INSTALLER_TITLE: ${{ vars.CUSTOM_INSTALLER_TITLE || '' }}
        CUSTOM_INSTALLER_DESCRIPTION: ${{ vars.CUSTOM_INSTALLER_DESCRIPTION || '' }}
        CUSTOM_PUBLISHER: ${{ vars.CUSTOM_PUBLISHER || '' }}
        CUSTOM_MAINTAINER: ${{ vars.CUSTOM_MAINTAINER || '' }}
        CUSTOM_CONTACT_EMAIL: ${{ vars.CUSTOM_CONTACT_EMAIL || '' }}
        CUSTOM_CUSTOMIZATION_NOTICE: ${{ vars.CUSTOM_CUSTOMIZATION_NOTICE || '' }}
        CUSTOM_WINDOWS_COMPANY_NAME: ${{ vars.CUSTOM_WINDOWS_COMPANY_NAME || '' }}
        CUSTOM_LINUX_GENERIC_NAME: ${{ vars.CUSTOM_LINUX_GENERIC_NAME || '' }}
        CUSTOM_LINUX_COMMENT: ${{ vars.CUSTOM_LINUX_COMMENT || '' }}
        CUSTOM_WEBSITE_URL: ${{ vars.CUSTOM_WEBSITE_URL || '' }}
        CUSTOM_HELP_URL: ${{ vars.CUSTOM_HELP_URL || '' }}
        CUSTOM_SUPPORT_URL: ${{ vars.CUSTOM_SUPPORT_URL || '' }}
        CUSTOM_PRIVACY_URL: ${{ vars.CUSTOM_PRIVACY_URL || '' }}
        CUSTOM_DISPLAY_NAME_EN: ${{ vars.CUSTOM_DISPLAY_NAME_EN || '' }}
        CUSTOM_DISPLAY_NAME_ZH_CN: ${{ vars.CUSTOM_DISPLAY_NAME_ZH_CN || '' }}
        CUSTOM_ABOUT_TITLE_EN: ${{ vars.CUSTOM_ABOUT_TITLE_EN || '' }}
        CUSTOM_ABOUT_TITLE_ZH_CN: ${{ vars.CUSTOM_ABOUT_TITLE_ZH_CN || '' }}
        CUSTOM_ANDROID_APP_LABEL_EN: ${{ vars.CUSTOM_ANDROID_APP_LABEL_EN || '' }}
        CUSTOM_ANDROID_APP_LABEL_ZH_CN: ${{ vars.CUSTOM_ANDROID_APP_LABEL_ZH_CN || '' }}
        CUSTOM_ANDROID_SERVICE_LABEL_EN: ${{ vars.CUSTOM_ANDROID_SERVICE_LABEL_EN || '' }}
        CUSTOM_ANDROID_SERVICE_LABEL_ZH_CN: ${{ vars.CUSTOM_ANDROID_SERVICE_LABEL_ZH_CN || '' }}
        CUSTOM_LINUX_APP_LABEL_EN: ${{ vars.CUSTOM_LINUX_APP_LABEL_EN || '' }}
        CUSTOM_LINUX_APP_LABEL_ZH_CN: ${{ vars.CUSTOM_LINUX_APP_LABEL_ZH_CN || '' }}
        CUSTOM_DESCRIPTION_EN: ${{ vars.CUSTOM_DESCRIPTION_EN || '' }}
        CUSTOM_DESCRIPTION_ZH_CN: ${{ vars.CUSTOM_DESCRIPTION_ZH_CN || '' }}
        CUSTOM_SLOGAN_EN: ${{ vars.CUSTOM_SLOGAN_EN || '' }}
        CUSTOM_SLOGAN_ZH_CN: ${{ vars.CUSTOM_SLOGAN_ZH_CN || '' }}
        CUSTOM_INSTALLER_TITLE_EN: ${{ vars.CUSTOM_INSTALLER_TITLE_EN || '' }}
        CUSTOM_INSTALLER_TITLE_ZH_CN: ${{ vars.CUSTOM_INSTALLER_TITLE_ZH_CN || '' }}
        CUSTOM_INSTALLER_DESCRIPTION_EN: ${{ vars.CUSTOM_INSTALLER_DESCRIPTION_EN || '' }}
        CUSTOM_INSTALLER_DESCRIPTION_ZH_CN: ${{ vars.CUSTOM_INSTALLER_DESCRIPTION_ZH_CN || '' }}
        CUSTOM_CUSTOMIZATION_NOTICE_EN: ${{ vars.CUSTOM_CUSTOMIZATION_NOTICE_EN || '' }}
        CUSTOM_CUSTOMIZATION_NOTICE_ZH_CN: ${{ vars.CUSTOM_CUSTOMIZATION_NOTICE_ZH_CN || '' }}
        CUSTOM_LINUX_GENERIC_NAME_EN: ${{ vars.CUSTOM_LINUX_GENERIC_NAME_EN || '' }}
        CUSTOM_LINUX_GENERIC_NAME_ZH_CN: ${{ vars.CUSTOM_LINUX_GENERIC_NAME_ZH_CN || '' }}
        CUSTOM_LINUX_COMMENT_EN: ${{ vars.CUSTOM_LINUX_COMMENT_EN || '' }}
        CUSTOM_LINUX_COMMENT_ZH_CN: ${{ vars.CUSTOM_LINUX_COMMENT_ZH_CN || '' }}
        CUSTOM_LOGO_PATH: ${{ vars.CUSTOM_LOGO_PATH || '' }}
        CUSTOM_LOGO_LIGHT_PATH: ${{ vars.CUSTOM_LOGO_LIGHT_PATH || '' }}
        CUSTOM_LOGO_DARK_PATH: ${{ vars.CUSTOM_LOGO_DARK_PATH || '' }}
        CUSTOM_APP_ICON_PATH: ${{ vars.CUSTOM_APP_ICON_PATH || '' }}
        CUSTOM_TRAY_ICON_PATH: ${{ vars.CUSTOM_TRAY_ICON_PATH || '' }}
      run: python3 -m scripts.source.branding --output .work/branding-input.json --repository "$GITHUB_REPOSITORY"
    - name: Fetch exact official source
      run: bash scripts/source/prepare.sh "$UPSTREAM_EXPECTED_SHA" .work/official
    - id: profile
      name: Resolve reviewed official bridge/build profile
      run: python3 scripts/build/build_adapter.py .work/official --output .work/build-profile.json
    - name: Review all Nightly native target interfaces before bridge dependencies
      if: inputs.channel == 'nightly'
      run: python3 scripts/release/nightly.py preflight --tree .work/official
    - name: Review both Wayland target interfaces before bridge dependencies
      if: inputs.build_wayland
      run: |
        python3 scripts/platform/wayland.py preflight --tree .work/official --arch x86_64
        python3 scripts/platform/wayland.py preflight --tree .work/official --arch aarch64
    - name: Install official bridge prerequisites
      run: |
        sudo apt-get update -y
        sudo apt-get install -y clang cmake libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ steps.profile.outputs.rust }}
        components: rustfmt
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: ${{ steps.profile.outputs.bridge_flutter }}
        channel: stable
    - name: Copy exact official source for bridge generation
      run: cp -a .work/official .work/bridge-source
    - name: Generate bridge from exact official source
      working-directory: .work/bridge-source
      env:
        CARGO_EXPAND: ${{ steps.profile.outputs.cargo_expand }}
        FRB: ${{ steps.profile.outputs.frb }}
      run: |
        cargo install cargo-expand --version "$CARGO_EXPAND" --locked
        cargo install flutter_rust_bridge_codegen --version "$FRB" --features uuid --locked
        sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
        (cd flutter && flutter pub get)
        flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
        cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h
        cd "$GITHUB_WORKSPACE"
        python3 -m scripts.release.package bridge-info .work/bridge-source
    - name: Install pinned Syft for exact-source upstream SBOM profile
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
    - name: Prepare Common once and fork independent variant sources
      run: |
        python3 scripts/source/prepared_source.py prepare           --base .work/official           --output .work/prepared           --ref "$UPSTREAM_REF"           --sha "$UPSTREAM_EXPECTED_SHA"           --patchset "$PATCHSET"           --bridge .work/bridge-source
    - id: identity
      run: "python3 - <<'PYCODE'\nimport json,os\nfrom pathlib import Path\na=json.loads(Path('.work/prepared/standard/source-manifest.json').read_text());\
        \ b=json.loads(Path('.work/prepared/sos/source-manifest.json').read_text())\nfor k in ('upstream_sha','patchset','common_patch_hash','custom_repository_sha','prepare_workflow_run'):\n\
        \ assert a[k]==b[k], k\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:\n for variant,m in [('standard',a),('sos',b)]:\n\
        \  identity=m['common_patch_hash'] if variant=='standard' else m['sos_patch_hash']\n  f.write(variant+'_artifact=prepared-'+variant+'-'+m['upstream_sha']+'-'+identity+'\\\
        n')\n f.write('upstream_version='+a['upstream_version']+'\\n')\nPYCODE"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.identity.outputs.standard_artifact }}
        path: .work/prepared/prepared-standard/
        retention-days: 7
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.identity.outputs.sos_artifact }}
        path: .work/prepared/prepared-sos/
        retention-days: 7
        if-no-files-found: error
