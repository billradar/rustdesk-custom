name: Upstream Main Sync Audit
'on':
  workflow_dispatch: {}
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: upstream-main-sync-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit official upstream default branch
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Resolve upstream default branch
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, urllib.request, pathlib
        def api(path):
            req=urllib.request.Request('https://api.github.com/'+path,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'rustdesk-custom-upstream-main-sync'})
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
        repo=api('repos/rustdesk/rustdesk'); branch=repo['default_branch']
        sha=api('repos/rustdesk/rustdesk/commits/'+branch)['sha']
        record={'repository':'rustdesk/rustdesk','default_branch':branch,'head_sha':sha}
        pathlib.Path('.work').mkdir(exist_ok=True)
        pathlib.Path('.work/upstream-main.json').write_text(json.dumps(record,indent=2)+'\n')
        print(json.dumps(record,indent=2))
        PY
    - name: Resolve upstream-main CI identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REF="$(python3 -c 'import json; print(json.load(open(".work/upstream-main.json"))["head_sha"])')"
        python3 scripts/release/channel.py resolve --channel ci --ref "$REF"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: upstream-main-${{ github.run_id }}
        path: .work/upstream-main.json
        if-no-files-found: error