name: Release Coordinator state maintenance
'on':
  workflow_run:
    workflows: [Stable Release Pipeline, Nightly Build Pipeline]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [grant, recover-missing]
        default: grant
        description: Normal retry grant or explicit missing-run reservation recovery
      recovery_snapshot:
        type: string
        description: Exact reviewed journal commit SHA (recover-missing only)
      recovery_run:
        type: string
        description: Exact old missing workflow run ID (recover-missing only)
      recovery_confirmation:
        type: string
        description: Type STOPPED_AND_BUILD_STARTED only after confirming old workers stopped and actual build entry
      channel:
        type: choice
        options: [nightly, stable]
        required: true
      build_identity:
        type: string
        required: true
        description: Existing coordinator key; never a new source selection
      reason:
        type: string
        required: true
        description: Reviewed reason for one new reservation
permissions:
  contents: read
  actions: read
jobs:
  coordinator-state:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/release-coordinator.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      RETRY_CHANNEL: ${{ inputs.channel }}
      RETRY_IDENTITY: ${{ inputs.build_identity }}
      RETRY_REASON: ${{ inputs.reason }}
      RECOVERY_MODE: ${{ inputs.operation || 'grant' }}
      RECOVERY_SNAPSHOT: ${{ inputs.recovery_snapshot }}
      RECOVERY_RUN: ${{ inputs.recovery_run }}
      RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: main
        persist-credentials: false
    - run: python3 -m pip install -r requirements.txt
    - name: Reconcile exact completed run
      if: github.event_name == 'workflow_run'
      run: python3 -m scripts.release.coordinator.runtime observe
    - name: Record one explicit reviewed retry grant
      if: github.event_name == 'workflow_dispatch'
      run: python3 -m scripts.release.coordinator.runtime grant
