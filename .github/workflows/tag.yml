name: Stable - Draft only
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        description: Official stable tag; empty = latest stable
        default: ''
      force_rebuild:
        type: boolean
        description: Artifacts only for existing revision; never overwrite
        default: false
      dry_run:
        type: boolean
        description: Skip draft creation, keep artifacts only
        default: true
      include_experimental:
        type: boolean
        default: false
        description: Experimental target validation; forces artifacts-only, no Draft
  schedule:
  - cron: 41 5,17 * * *
permissions:
  contents: read
  actions: read
concurrency:
  group: phase4-stable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
        CHANNEL: stable
      run: python3 scripts/phase4.py resolve --channel "$CHANNEL" --ref "$REQUESTED_REF" --discovery-only
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  draft-preflight:
    name: Draft release preflight (no writes)
    needs: resolve
    runs-on: ubuntu-22.04
    # GitHub requires Contents write permission to view unpublished drafts.
    # This release-lifecycle job only performs GETs and has no production inputs.
    permissions:
      contents: write
      actions: read
    outputs:
      build_needed: ${{ steps.gate.outputs.build_needed }}
      draft_needed: ${{ steps.gate.outputs.draft_needed }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/discovery
    - id: gate
      name: Validate existing revision before any build
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ inputs.force_rebuild || false }}
      run: |
        args=()
        [[ "$FORCE" != true ]] || args+=(--force)
        python3 scripts/phase4.py release-preflight --discovery .work/discovery/channel.json "${args[@]}"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-preflight-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  compatibility:
    needs: [resolve, draft-preflight]
    uses: ./.github/workflows/compat-check.yml
    with:
      upstream_repository: rustdesk/rustdesk
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
    if: needs.draft-preflight.outputs.build_needed == 'true'
  prepare:
    needs:
    - resolve
    - compatibility
    uses: ./.github/workflows/prepare-source.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.compatibility.outputs.patchset }}
  build:
    needs:
    - resolve
    - compatibility
    - prepare
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.compatibility.outputs.patchset }}
      upstream_version: ${{ needs.prepare.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
      revision: ${{ needs.resolve.outputs.revision }}
      include_experimental: ${{ inputs.include_experimental || false }}
      production_android_signing: ${{ inputs.dry_run != true && inputs.include_experimental != true }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  draft:
    needs:
    - resolve
    - draft-preflight
    - compatibility
    - prepare
    - build
    if: needs.draft-preflight.outputs.draft_needed == 'true' && inputs.dry_run != true && inputs.include_experimental != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_ref }}
      BUILD_CONFIGURATION: PRODUCTION
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements-build.txt
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: rustdesk-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - name: Package inspectors for supported aggregate
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - name: Create complete supported Draft only; no publish path
      run: python3 scripts/phase5.py draft --root .work/collected
