name: Stable Release Pipeline
run-name: Stable ${{ inputs.upstream_ref || 'latest' }} / ${{ inputs.release_mode }}
env:
  PYTHONPATH: .
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        description: Official stable tag; empty = latest stable
        default: ''
      force_rebuild:
        type: boolean
        description: Rebuild an existing revision
        default: false
      release_mode:
        type: choice
        description: Release mode
        options:
          - dry-run
          - draft
          - release
        default: dry-run
permissions:
  contents: read
  actions: read
concurrency:
  group: stable-${{ inputs.upstream_ref || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_version: ${{ steps.resolve.outputs.version }}
      patchset: ${{ steps.patchset.outputs.patchset }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
        CHANNEL: stable
      run: python3 scripts/release/channel.py resolve --channel "$CHANNEL" --ref "$REQUESTED_REF" --discovery-only
    - id: patchset
      name: Resolve exact Stable patchset
      env:
        UPSTREAM_SHA: ${{ steps.resolve.outputs.upstream_sha }}
        UPSTREAM_REF: ${{ steps.resolve.outputs.upstream_ref }}
      run: python3 scripts/upstream/patchsets.py "$UPSTREAM_SHA" --ref "$UPSTREAM_REF" --exact
    - name: Validate Stable execution identity
      env:
        UPSTREAM_SHA: ${{ steps.resolve.outputs.upstream_sha }}
        PATCHSET: ${{ steps.patchset.outputs.patchset }}
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid upstream_sha"; exit 1; }
        [[ "$PATCHSET" =~ ^v[1-9][0-9]*$ ]] || { echo "Invalid patchset"; exit 1; }
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
        python3 - <<'PY'
        import os
        from scripts.upstream.patchsets import verify
        verify(os.environ["PATCHSET"])
        print("Stable execution identity: PASS")
        print("  upstream_sha =", os.environ["UPSTREAM_SHA"])
        print("  patchset     =", os.environ["PATCHSET"])
        print("  version      =", os.environ["VERSION"])
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  draft-preflight:
    name: Draft release preflight (no writes)
    needs: resolve
    runs-on: ubuntu-22.04
    # GitHub requires Contents write permission to view unpublished drafts.
    # This release-lifecycle job only performs GETs and has no production inputs.
    permissions:
      contents: write
      actions: read
    outputs:
      build_needed: ${{ steps.gate.outputs.build_needed }}
      draft_needed: ${{ steps.gate.outputs.draft_needed }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/discovery
    - id: gate
      name: Validate existing revision before any build
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ inputs.force_rebuild || false }}
      run: |
        args=()
        [[ "$FORCE" != true ]] || args+=(--force)
        python3 scripts/release/channel.py release-preflight --discovery .work/discovery/channel.json "${args[@]}"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-preflight-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  prepare:
    needs:
    - resolve
    - draft-preflight
    if: needs.draft-preflight.outputs.build_needed == 'true'
    uses: ./.github/workflows/prepare-source.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.resolve.outputs.patchset }}
  windows-build:
    name: Build Stable Windows targets
    needs:
    - resolve
    - prepare
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.resolve.outputs.patchset }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
      revision: ${{ needs.resolve.outputs.revision }}
      windows_only: true
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  platforms-build:
    name: Build Stable Linux and macOS targets
    needs:
    - resolve
    - prepare
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.resolve.outputs.patchset }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
      revision: ${{ needs.resolve.outputs.revision }}
      other_platforms_only: true
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  android-build:
    name: Build Stable Android artifacts for production signing
    needs:
    - resolve
    - prepare
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.resolve.outputs.patchset }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
      revision: ${{ needs.resolve.outputs.revision }}
      android_only: true
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  android-sign:
    name: Sign Stable Android production artifacts with YubiKey PIV 9C
    needs: [resolve, draft-preflight, prepare, android-build]
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/tag.yml@refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_mode != 'dry-run' &&
      needs.android-build.result == 'success' &&
      needs.prepare.result == 'success'
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-yubikey-signing
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |
          metadata/yubikey-android-signing-identity.json
          scripts/signing/android_yubikey_sign.py
          .github/actions/android-yubikey-sign/action.yml
        sparse-checkout-cone-mode: false
        fetch-depth: 1
    - name: Validate public YubiKey identity metadata
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        info = json.loads(Path("metadata/yubikey-android-signing-identity.json").read_text())
        assert info["certificate_sha256"] == "559c1ede0fbe3a01f29bcac9d0b34bd9691df3562c83e3019a930506fbc7b6f5"
        assert info["piv_slot"] == "9C" and info["pkcs11_id"] == "02"
        print("YubiKey identity metadata: PASS")
        PY
    - name: Environment Secret Binding Preflight
      shell: bash
      env:
        YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
      run: |
        set -euo pipefail
        if [[ -z "${YUBIKEY_PIV_PIN:-}" ]]; then
          printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: FAIL'
          exit 1
        fi
        printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: PASS'
    - name: Production Android signing
      uses: ./.github/actions/android-yubikey-sign
      env:
        YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
      with:
        arches: aarch64,armv7,x86_64
        channel: stable
        upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
        upstream_version: ${{ needs.resolve.outputs.upstream_version }}
        patchset: ${{ needs.resolve.outputs.patchset }}
  aggregate:
    name: Aggregate verified Stable production artifacts
    needs: [resolve, draft-preflight, prepare, windows-build, platforms-build, android-build, android-sign]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.windows-build.result == 'success' &&
      needs.platforms-build.result == 'success' &&
      needs.android-build.result == 'success' &&
      (needs.android-sign.result == 'success' || inputs.release_mode == 'dry-run')
    runs-on: ubuntu-22.04
    env:
      PATCHSET: ${{ needs.resolve.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      BUILD_CONFIGURATION: PRODUCTION
      CHANNEL: stable
      EXPERIMENTAL: 'false'
      REQUIRE_ANDROID_PRODUCTION_SIGNING: ${{ inputs.release_mode != 'dry-run' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements.txt
    - name: Package inspectors
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-stable-${{ needs.resolve.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/all-targets
        merge-multiple: false
    - name: Fail-closed expected target and cross-platform provenance gate
      run: python3 scripts/release/qualification.py aggregate --channel stable
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: platform-aggregate-${{ github.run_id }}
        path: .work/aggregate/
        if-no-files-found: warn
  publish-existing:
    name: Publish existing verified Stable draft
    needs: [resolve, draft-preflight]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_mode == 'release' &&
      needs.draft-preflight.outputs.build_needed == 'false' &&
      needs.draft-preflight.outputs.draft_needed == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ needs.resolve.outputs.upstream_version }}-custom.${{ needs.resolve.outputs.revision }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Publish verified existing Stable draft
      run: python3 scripts/release/qualification.py publish-existing --channel stable
  release:
    name: Publish Stable Release
    needs:
    - resolve
    - draft-preflight
    - prepare
    - windows-build
    - platforms-build
    - android-build
    - android-sign
    - aggregate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.draft-preflight.outputs.draft_needed == 'true' &&
      needs.draft-preflight.outputs.build_needed == 'true' &&
      inputs.release_mode == 'release' &&
      needs.windows-build.result == 'success' &&
      needs.platforms-build.result == 'success' &&
      needs.android-build.result == 'success' &&
      needs.aggregate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-stable-${{ needs.resolve.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - name: Package inspectors for supported aggregate
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - name: Create and publish complete supported Release
      run: python3 scripts/release/qualification.py release --root .work/collected
  draft:
    needs:
    - resolve
    - draft-preflight
    - prepare
    - windows-build
    - platforms-build
    - android-build
    - android-sign
    - aggregate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.draft-preflight.outputs.draft_needed == 'true' &&
      inputs.release_mode == 'draft' &&
      needs.windows-build.result == 'success' &&
      needs.platforms-build.result == 'success' &&
      needs.android-build.result == 'success' &&
      needs.aggregate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET: ${{ needs.resolve.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_ref }}
      BUILD_CONFIGURATION: PRODUCTION
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-stable-${{ needs.resolve.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - name: Package inspectors for supported aggregate
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - name: Create complete supported Draft release
      run: python3 scripts/release/qualification.py draft --root .work/collected
