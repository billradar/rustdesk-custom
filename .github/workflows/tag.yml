name: Stable - Draft only
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        description: Official stable tag; empty = latest stable
        default: ''
      force_rebuild:
        type: boolean
        description: Artifacts only for existing revision; never overwrite
        default: false
      dry_run:
        type: boolean
        description: Skip draft creation, keep artifacts only
        default: true
      include_experimental:
        type: boolean
        default: false
        description: Experimental target validation; forces artifacts-only, no Draft
      production_android_signing:
        type: boolean
        required: false
        default: false
        description: Explicitly authorize Stable Android production signing for this manual run
  schedule:
  - cron: 41 5,17 * * *
permissions:
  contents: read
  actions: read
concurrency:
  group: phase4-stable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
        CHANNEL: stable
      run: python3 scripts/phase4.py resolve --channel "$CHANNEL" --ref "$REQUESTED_REF" --discovery-only
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  draft-preflight:
    name: Draft release preflight (no writes)
    needs: resolve
    runs-on: ubuntu-22.04
    # GitHub requires Contents write permission to view unpublished drafts.
    # This release-lifecycle job only performs GETs and has no production inputs.
    permissions:
      contents: write
      actions: read
    outputs:
      build_needed: ${{ steps.gate.outputs.build_needed }}
      draft_needed: ${{ steps.gate.outputs.draft_needed }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/discovery
    - id: gate
      name: Validate existing revision before any build
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ inputs.force_rebuild || false }}
      run: |
        args=()
        [[ "$FORCE" != true ]] || args+=(--force)
        python3 scripts/phase4.py release-preflight --discovery .work/discovery/channel.json "${args[@]}"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-preflight-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  compatibility:
    needs: [resolve, draft-preflight]
    uses: ./.github/workflows/compat-check.yml
    with:
      upstream_repository: rustdesk/rustdesk
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
    if: needs.draft-preflight.outputs.build_needed == 'true'
  prepare:
    needs:
    - resolve
    - compatibility
    uses: ./.github/workflows/prepare-source.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.compatibility.outputs.patchset }}
  build:
    needs:
    - resolve
    - compatibility
    - prepare
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.compatibility.outputs.patchset }}
      upstream_version: ${{ needs.prepare.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
      revision: ${{ needs.resolve.outputs.revision }}
      include_experimental: ${{ inputs.include_experimental || false }}
      production_android_signing: ${{ github.event_name == 'workflow_dispatch' && inputs.production_android_signing == true && inputs.dry_run == false && inputs.include_experimental == false }}
      direct_android_signing: ${{ github.event_name == 'workflow_dispatch' && inputs.production_android_signing == true && inputs.dry_run == false && inputs.include_experimental == false }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  android-sign:
    name: Sign Stable Android standard artifacts with YubiKey PIV 9C
    needs: [resolve, draft-preflight, compatibility, prepare, build]
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/tag.yml@refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.production_android_signing == true &&
      inputs.dry_run == false &&
      inputs.include_experimental == false &&
      needs.build.result == 'success'
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-yubikey-signing
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    env:
      SIGNING_CHANNEL: stable
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Download aarch64 Android unsigned build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: android-build-input-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-standard-android-aarch64
        path: .work/android-build-input/aarch64
    - name: Download armv7 Android unsigned build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: android-build-input-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-standard-android-armv7
        path: .work/android-build-input/armv7
    - name: Download x86_64 Android unsigned build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: android-build-input-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-standard-android-x86_64
        path: .work/android-build-input/x86_64
    - name: Validate aarch64 artifact provenance, package, ABI, checksum, and source
      id: input_aarch64
      env:
        SIGNING_ARCH: aarch64
      run: python3 scripts/android_signing.py validate-yubikey-input .work/android-build-input/aarch64 --arch "$SIGNING_ARCH"
    - name: Validate armv7 artifact provenance, package, ABI, checksum, and source
      id: input_armv7
      env:
        SIGNING_ARCH: armv7
      run: python3 scripts/android_signing.py validate-yubikey-input .work/android-build-input/armv7 --arch "$SIGNING_ARCH"
    - name: Validate x86_64 artifact provenance, package, ABI, checksum, and source
      id: input_x86_64
      env:
        SIGNING_ARCH: x86_64
      run: python3 scripts/android_signing.py validate-yubikey-input .work/android-build-input/x86_64 --arch "$SIGNING_ARCH"
    - name: Production YubiKey signing (explicit Stable one-shot gate)
      id: hardware-sign
      if: >-
        github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/tag.yml@refs/heads/main' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.production_android_signing == true &&
        inputs.dry_run == false &&
        inputs.include_experimental == false
      env:
        YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
        AARCH64_APK: ${{ steps.input_aarch64.outputs.apk }}
        ARMV7_APK: ${{ steps.input_armv7.outputs.apk }}
        X86_64_APK: ${{ steps.input_x86_64.outputs.apk }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        ulimit -c 0
        trap 'unset YUBIKEY_PIV_PIN' EXIT
        if [[ -z "${YUBIKEY_PIV_PIN:-}" ]]; then
          printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: FAIL'
          exit 1
        fi
        printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: PASS'
        signed_dir="$RUNNER_TEMP/rustdesk-yubikey-signing"
        install -d -m 0700 "$signed_dir"
        /usr/local/bin/rustdesk-sign \
          --input "$AARCH64_APK" \
          --output "$signed_dir/aarch64.apk" \
          --pin-source env
        chmod 0600 "$signed_dir/aarch64.apk"
        printf '%s\n' 'YubiKey aarch64 signing: PASS'
        /usr/local/bin/rustdesk-sign \
          --input "$ARMV7_APK" \
          --output "$signed_dir/armv7.apk" \
          --pin-source env
        chmod 0600 "$signed_dir/armv7.apk"
        printf '%s\n' 'YubiKey armv7 signing: PASS'
        /usr/local/bin/rustdesk-sign \
          --input "$X86_64_APK" \
          --output "$signed_dir/x86_64.apk" \
          --pin-source env
        chmod 0600 "$signed_dir/x86_64.apk"
        printf '%s\n' 'YubiKey x86_64 signing: PASS'
    - name: Verify signer and assemble production artifact
      id: verify
      if: steps.hardware-sign.outcome == 'success'
      env:
        AARCH64_BUNDLE: ${{ steps.input_aarch64.outputs.bundle }}
        ARMV7_BUNDLE: ${{ steps.input_armv7.outputs.bundle }}
        X86_64_BUNDLE: ${{ steps.input_x86_64.outputs.bundle }}
      run: |
        set -euo pipefail
        python3 scripts/android_signing.py finalize-yubikey "$AARCH64_BUNDLE" "$RUNNER_TEMP/rustdesk-yubikey-signing/aarch64.apk" .work/verified-signed/aarch64 --arch aarch64
        python3 scripts/android_signing.py finalize-yubikey "$ARMV7_BUNDLE" "$RUNNER_TEMP/rustdesk-yubikey-signing/armv7.apk" .work/verified-signed/armv7 --arch armv7
        python3 scripts/android_signing.py finalize-yubikey "$X86_64_BUNDLE" "$RUNNER_TEMP/rustdesk-yubikey-signing/x86_64.apk" .work/verified-signed/x86_64 --arch x86_64
    - name: Upload verified Stable Android aarch64 artifact
      if: steps.verify.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-standard-android-aarch64
        path: .work/verified-signed/aarch64/
        if-no-files-found: error
        retention-days: 14
    - name: Upload verified Stable Android armv7 artifact
      if: steps.verify.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-standard-android-armv7
        path: .work/verified-signed/armv7/
        if-no-files-found: error
        retention-days: 14
    - name: Upload verified Stable Android x86_64 artifact
      if: steps.verify.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-standard-android-x86_64
        path: .work/verified-signed/x86_64/
        if-no-files-found: error
        retention-days: 14
    - name: Remove temporary signing files
      if: always()
      run: |
        python3 - <<'PY'
        import os, shutil
        from pathlib import Path
        for path in (Path('.work/android-build-input'), Path('.work/verified-signed'),
                     Path(os.environ['RUNNER_TEMP']) / 'rustdesk-yubikey-signing'):
            if path.exists():
                shutil.rmtree(path)
        PY
  aggregate:
    name: Aggregate verified Stable production artifacts
    needs: [resolve, draft-preflight, compatibility, prepare, build, android-sign]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.production_android_signing == true &&
      inputs.dry_run == false &&
      inputs.include_experimental == false &&
      needs.build.result == 'success' &&
      needs.android-sign.result == 'success'
    runs-on: ubuntu-22.04
    env:
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      BUILD_CONFIGURATION: PRODUCTION
      CHANNEL: stable
      EXPERIMENTAL: 'false'
      REQUIRE_ANDROID_PRODUCTION_SIGNING: 'true'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements-build.txt
    - name: Package inspectors
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: rustdesk-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/all-targets
        merge-multiple: false
    - name: Fail-closed expected target and cross-platform provenance gate
      run: python3 scripts/phase5.py aggregate --channel stable
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: platform-aggregate-${{ github.run_id }}
        path: .work/phase5-aggregate/
        if-no-files-found: warn
  draft:
    needs:
    - resolve
    - draft-preflight
    - compatibility
    - prepare
    - build
    - android-sign
    - aggregate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.draft-preflight.outputs.draft_needed == 'true' &&
      inputs.dry_run == false &&
      inputs.include_experimental == false &&
      inputs.production_android_signing == true &&
      needs.aggregate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET: ${{ needs.compatibility.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_ref }}
      BUILD_CONFIGURATION: PRODUCTION
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements-build.txt
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: rustdesk-stable-${{ needs.prepare.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - name: Package inspectors for supported aggregate
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - name: Create complete supported Draft only; no publish path
      run: python3 scripts/phase5.py draft --root .work/collected
