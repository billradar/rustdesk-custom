name: Stable Release Pipeline
run-name: Stable ${{ inputs.upstream_ref || 'latest' }} / ${{ inputs.release_mode }} / wayland=${{ inputs.include_wayland && 'true' || 'false' }} / android-signing=${{ vars.ANDROID_PRODUCTION_SIGNING_ENABLED || 'false' }}
env:
  PYTHONPATH: .
'on':
  workflow_dispatch:
    inputs:
      include_wayland:
        type: boolean
        default: true
        description: Build all four experimental Wayland DEBs and include validated packages
      force_retry:
        type: boolean
        default: false
        description: Bypass cooldown only on manual main runs; active/success/review still block
      upstream_ref:
        type: string
        description: Official stable tag; empty = latest stable
        default: ''
      release_mode:
        type: choice
        description: Release mode
        options:
          - dry-run
          - draft
        default: dry-run
permissions:
  contents: read
  actions: read
concurrency:
  group: stable-${{ inputs.upstream_ref || 'latest' }}-${{ inputs.include_wayland && 'wayland' || 'no-wayland' }}-${{ vars.ANDROID_PRODUCTION_SIGNING_ENABLED || 'false' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: '01 · Resolve Stable source identity'
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_version: ${{ steps.resolve.outputs.version }}
      patchset: ${{ steps.patchset.outputs.patchset }}
      build_identity: ${{ steps.lock.outputs.build_identity }}
      lock_sha256: ${{ steps.lock.outputs.lock_sha256 }}
      lock_artifact: ${{ steps.lock.outputs.lock_artifact }}
      signing_enabled: ${{ steps.lock.outputs.signing_enabled }}
      dedup_skip: ${{ steps.dedup.outputs.skip }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Validate Stable branch and mode boundary
      env:
        RELEASE_MODE: ${{ inputs.release_mode }}
      run: |
        [[ "$RELEASE_MODE" == dry-run || "$RELEASE_MODE" == draft ]] || { echo "Stable builds only support dry-run or draft" >&2; exit 1; }
        if [[ "$GITHUB_REF" != refs/heads/main && "$RELEASE_MODE" != dry-run ]]; then
          echo 'Non-main Stable runs are dry-run only.' >&2
          exit 1
        fi
    - name: Require release App configuration before expensive builds
      if: inputs.release_mode != 'dry-run'
      env:
        RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
        RELEASE_APP_KEY_PRESENT: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      run: python3 scripts/release/app_credentials.py
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
        CHANNEL: stable
      run: python3 scripts/release/channel.py resolve --channel "$CHANNEL" --ref "$REQUESTED_REF" --discovery-only
    - id: patchset
      name: Select Stable patchset by version boundary / exact maintained Profile
      env:
        UPSTREAM_VERSION: ${{ steps.resolve.outputs.version }}
      run: python3 scripts/upstream/patchsets.py --version "$UPSTREAM_VERSION" --channel stable
    - name: Validate Stable execution identity
      env:
        UPSTREAM_SHA: ${{ steps.resolve.outputs.upstream_sha }}
        PATCHSET: ${{ steps.patchset.outputs.patchset }}
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid upstream_sha"; exit 1; }
        [[ "$PATCHSET" =~ ^v[1-9][0-9]*$ ]] || { echo "Invalid patchset"; exit 1; }
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
        printf '%s\n' 'Static patchset selection: PASS'
        printf '  upstream_sha = %s\n' "$UPSTREAM_SHA"
        printf '  patchset     = %s\n' "$PATCHSET"
        printf '  version      = %s\n' "$VERSION"
    - id: lock
      name: Automatically freeze Stable build identity
      env:
        INCLUDE_WAYLAND: ${{ inputs.include_wayland && 'true' || 'false' }}
        ANDROID_PRODUCTION_SIGNING_ENABLED: ${{ vars.ANDROID_PRODUCTION_SIGNING_ENABLED || 'false' }}
        SELECTED_PATCHSET: ${{ steps.patchset.outputs.patchset }}
      run: python3 -m scripts.release.stable_lock create --discovery .work/channel.json --patchset "$SELECTED_PATCHSET"
    - id: dedup
      name: Skip earlier active or successful identical Stable builds
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_MODE: ${{ inputs.release_mode }}
        FORCE_RETRY: ${{ inputs.force_retry && 'true' || 'false' }}
      run: python3 -m scripts.release.stable_router dedup
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.lock.outputs.lock_artifact }}
        path: .work/stable-lock.json
        if-no-files-found: error
  draft-preflight:
    name: '02 · Release preflight / existing-draft decision'
    needs: resolve
    if: needs.resolve.outputs.dedup_skip != 'true'
    runs-on: ubuntu-22.04
    # GitHub requires Contents write permission to view unpublished drafts.
    # This release-lifecycle job only performs GETs and has no production inputs.
    permissions:
      contents: write
      actions: read
    outputs:
      build_needed: ${{ steps.gate.outputs.build_needed }}
      draft_needed: ${{ steps.gate.outputs.draft_needed }}
      publish_existing: ${{ steps.gate.outputs.publish_existing }}
      revision: ${{ steps.gate.outputs.revision }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
      build_identity: ${{ steps.gate.outputs.build_identity }}
      patch_revision: ${{ steps.gate.outputs.patch_revision }}
      custom_repository_sha: ${{ steps.gate.outputs.custom_repository_sha }}
      wayland_included: ${{ steps.gate.outputs.wayland_included }}
      wayland_policy_sha256: ${{ steps.gate.outputs.wayland_policy_sha256 }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: ${{ needs.resolve.outputs.lock_artifact }}
        path: .work/stable-lock
    - id: gate
      name: Verify locked identity before release preflight
      env:
        INCLUDE_WAYLAND: ${{ inputs.include_wayland && 'true' || 'false' }}
        ANDROID_PRODUCTION_SIGNING_ENABLED: ${{ vars.ANDROID_PRODUCTION_SIGNING_ENABLED || 'false' }}
        GH_TOKEN: ${{ github.token }}
        STABLE_LOCK_PATH: .work/stable-lock/stable-lock.json
        STABLE_LOCK_SHA256: ${{ needs.resolve.outputs.lock_sha256 }}
        EXPECTED_BUILD_IDENTITY: ${{ needs.resolve.outputs.build_identity }}
        RELEASE_MODE: ${{ inputs.release_mode }}
      run: python3 -m scripts.release.stable_lock preflight
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-preflight-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: .work/channel.json
        if-no-files-found: warn
  prepare:
    name: '03 · Prepare exact production source'
    needs:
    - resolve
    - draft-preflight
    if: needs.draft-preflight.outputs.build_needed == 'true'
    uses: ./.github/workflows/prepare-source.yml
    with:
      build_wayland: ${{ inputs.include_wayland }}
      patch_revision: ${{ needs.draft-preflight.outputs.patch_revision }}
      client_release_identity: true
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.resolve.outputs.patchset }}
  wayland-build:
    needs: [resolve, prepare]
    if: inputs.include_wayland && needs.prepare.result == 'success'
    uses: ./.github/workflows/wayland.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      patchset: ${{ needs.resolve.outputs.patchset }}
      channel: stable
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  windows-build:
    name: '04A · Build Stable Windows targets'
    needs:
    - resolve
    - draft-preflight
    - prepare
    uses: ./.github/workflows/build-stable-windows.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.resolve.outputs.patchset }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
      revision: ${{ needs.draft-preflight.outputs.revision }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  platforms-build:
    name: '04B · Build Stable Linux and macOS targets'
    needs:
    - resolve
    - prepare
    uses: ./.github/workflows/build-stable-platforms.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.resolve.outputs.patchset }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  android-build:
    name: '04C · Build Stable Android artifacts for signing'
    needs:
    - resolve
    - prepare
    uses: ./.github/workflows/build-stable-android.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: stable
      patchset: ${{ needs.resolve.outputs.patchset }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      standard_artifact: ${{ needs.prepare.outputs.standard_artifact }}
      sos_artifact: ${{ needs.prepare.outputs.sos_artifact }}
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  android-sign:
    name: '05 · Sign Stable Android production artifacts (YubiKey PIV 9C)'
    needs: [resolve, android-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/tag.yml@refs/heads/main', github.repository) &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_mode != 'dry-run' &&
      vars.ANDROID_PRODUCTION_SIGNING_ENABLED == 'true' &&
      needs.resolve.outputs.signing_enabled == 'true' &&
      needs.android-build.result == 'success'
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-yubikey-signing
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |
          metadata/signing/android-standard.json
          scripts/signing/android_yubikey_sign.py
          .github/actions/android-yubikey-sign/action.yml
        sparse-checkout-cone-mode: false
        fetch-depth: 1
    - name: Validate public YubiKey identity metadata
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        info = json.loads(Path("metadata/signing/android-standard.json").read_text())["production"]
        assert info["identity_kind"] == "new-yubikey-hardware-signing-identity"
        assert info["certificate_sha256"] == "559c1ede0fbe3a01f29bcac9d0b34bd9691df3562c83e3019a930506fbc7b6f5"
        assert info["piv_slot"] == "9C" and info["pkcs11_id"] == "02"
        print("YubiKey identity metadata: PASS")
        PY
    - name: Read-only Android v2/v3 runtime preflight
      shell: bash
      run: |
        set -euo pipefail
        if ! CAPABILITIES=$(/usr/local/bin/rustdesk-sign --capabilities 2>&1); then
          printf '%s\n' "$CAPABILITIES"
          printf '%s\n' 'ANDROID SIGNING RUNTIME PREFLIGHT: FAIL (installed bridge is outdated or unavailable; deploy and verify the reviewed v3 runtime)' >&2
          exit 1
        fi
        printf '%s\n' "$CAPABILITIES"
        grep -Fxq 'APK SIGNING SCHEMES: v1=YES, v2=YES, v3=YES, v3.1=NO, v4=NO' <<< "$CAPABILITIES" || {
          printf '%s\n' 'ANDROID SIGNING RUNTIME PREFLIGHT: FAIL (v3 capability is required)' >&2
          exit 1
        }
        grep -Fxq 'PIN REQUESTED: NO' <<< "$CAPABILITIES"
        grep -Fxq 'PRIVATE KEY OPERATION: NO' <<< "$CAPABILITIES"
        printf '%s\n' 'ANDROID SIGNING RUNTIME PREFLIGHT: PASS'
    - name: Production Android signing
      uses: ./.github/actions/android-yubikey-sign
      env:
        YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
      with:
        arches: aarch64,armv7,x86_64
        channel: stable
        upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
        upstream_version: ${{ needs.resolve.outputs.upstream_version }}
        patchset: ${{ needs.resolve.outputs.patchset }}
  aggregate:
    name: '06 · Aggregate and verify Stable production artifacts'
    needs: [resolve, draft-preflight, windows-build, platforms-build, android-build, android-sign, wayland-build]
    outputs:
      build_needed: ${{ needs.draft-preflight.outputs.build_needed }}
      draft_needed: ${{ needs.draft-preflight.outputs.draft_needed }}
      publish_existing: ${{ needs.draft-preflight.outputs.publish_existing }}
      upstream_version: ${{ needs.resolve.outputs.upstream_version }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      revision: ${{ needs.draft-preflight.outputs.patch_revision }}
      patch_revision: ${{ needs.draft-preflight.outputs.patch_revision }}
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      patchset: ${{ needs.resolve.outputs.patchset }}
      build_identity: ${{ needs.resolve.outputs.build_identity }}
      lock_sha256: ${{ needs.resolve.outputs.lock_sha256 }}
      lock_artifact: ${{ needs.resolve.outputs.lock_artifact }}
      signing_enabled: ${{ needs.resolve.outputs.signing_enabled }}
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.windows-build.result == 'success' &&
      needs.platforms-build.result == 'success' &&
      needs.android-build.result == 'success' &&
      (!inputs.include_wayland || needs.wayland-build.result == 'success') &&
      (needs.android-sign.result == 'success' || inputs.release_mode == 'dry-run' || needs.resolve.outputs.signing_enabled != 'true')
    runs-on: ubuntu-22.04
    env:
      STABLE_LOCK_REQUIRED: 'true'
      STABLE_LOCK_PATH: .work/stable-lock/stable-lock.json
      STABLE_LOCK_SHA256: ${{ needs.resolve.outputs.lock_sha256 }}
      EXPECTED_BUILD_IDENTITY: ${{ needs.resolve.outputs.build_identity }}
      INCLUDE_WAYLAND: ${{ inputs.include_wayland && 'true' || 'false' }}
      BUILD_CHANNEL: stable
      UPSTREAM_VERSION: ${{ needs.resolve.outputs.upstream_version }}
      PATCHSET: ${{ needs.resolve.outputs.patchset }}
      PATCH_REVISION: ${{ needs.draft-preflight.outputs.patch_revision }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.upstream_sha }}
      BUILD_CONFIGURATION: PRODUCTION
      CHANNEL: stable
      EXPERIMENTAL: 'false'
      ANDROID_PRODUCTION_SIGNING_ENABLED: ${{ needs.resolve.outputs.signing_enabled }}
      REQUIRE_ANDROID_PRODUCTION_SIGNING: ${{ inputs.release_mode != 'dry-run' && needs.resolve.outputs.signing_enabled == 'true' && 'true' || 'false' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: ${{ needs.resolve.outputs.lock_artifact }}
        path: .work/stable-lock
    - run: python3 -m pip install -r requirements.txt
    - name: Package inspectors
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-stable-${{ needs.resolve.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/all-targets
        merge-multiple: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      if: inputs.release_mode == 'dry-run' || needs.resolve.outputs.signing_enabled != 'true'
      with:
        pattern: android-build-input-stable-${{ needs.resolve.outputs.upstream_version }}-${{ needs.resolve.outputs.upstream_sha }}-*
        path: .work/all-targets/unsigned-android
        merge-multiple: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      if: inputs.include_wayland
      with:
        pattern: rustdesk-wayland-*
        path: .work/wayland-targets
        merge-multiple: false
    - name: Fail-closed expected target and cross-platform provenance gate
      run: python3 scripts/release/qualification.py aggregate --channel stable
    - name: Attest qualified release inventory
      id: release-attestation
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_mode != 'dry-run'
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with:
        subject-path: .work/qualification-aggregate/assets/update-manifest.json
    - name: Stage Sigstore release attestation bundle
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_mode != 'dry-run'
      env:
        ATTESTATION_BUNDLE: ${{ steps.release-attestation.outputs.bundle-path }}
      run: cp -- "$ATTESTATION_BUNDLE" .work/qualification-aggregate/assets/release-attestation.json
    - name: Upload verified-release proof handoff
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_mode != 'dry-run'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-attestation-stable-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: |
          .work/qualification-aggregate/assets/update-manifest.json
          .work/qualification-aggregate/assets/release-attestation.json
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: platform-aggregate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: .work/qualification-aggregate/
        if-no-files-found: warn
  draft:
    name: '07B · Create Stable Draft'
    needs: aggregate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.aggregate.outputs.draft_needed == 'true' &&
      inputs.release_mode == 'draft' &&
      needs.aggregate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      STABLE_LOCK_REQUIRED: 'true'
      STABLE_LOCK_PATH: .work/stable-lock/stable-lock.json
      STABLE_LOCK_SHA256: ${{ needs.aggregate.outputs.lock_sha256 }}
      EXPECTED_BUILD_IDENTITY: ${{ needs.aggregate.outputs.build_identity }}
      ANDROID_PRODUCTION_SIGNING_ENABLED: ${{ needs.aggregate.outputs.signing_enabled }}
      INCLUDE_WAYLAND: ${{ inputs.include_wayland && 'true' || 'false' }}
      BUILD_CHANNEL: stable
      UPSTREAM_VERSION: ${{ needs.aggregate.outputs.upstream_version }}
      GH_TOKEN: ${{ github.token }}
      PATCHSET: ${{ needs.aggregate.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.aggregate.outputs.upstream_sha }}
      UPSTREAM_TAG: ${{ needs.aggregate.outputs.upstream_ref }}
      BUILD_CONFIGURATION: PRODUCTION
      REQUIRE_ANDROID_PRODUCTION_SIGNING: ${{ needs.aggregate.outputs.signing_enabled == 'true' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: ${{ needs.aggregate.outputs.lock_artifact }}
        path: .work/stable-lock
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: rustdesk-stable-${{ needs.aggregate.outputs.upstream_version }}-${{ needs.aggregate.outputs.upstream_sha }}-*
        path: .work/collected
        merge-multiple: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      if: needs.aggregate.outputs.signing_enabled != 'true'
      with:
        pattern: android-build-input-stable-${{ needs.aggregate.outputs.upstream_version }}-${{ needs.aggregate.outputs.upstream_sha }}-*
        path: .work/collected/unsigned-android
        merge-multiple: false
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      if: inputs.include_wayland
      with:
        pattern: rustdesk-wayland-*
        path: .work/wayland-targets
        merge-multiple: false
    - name: Package inspectors for supported aggregate
      run: |
        sudo apt-get update -y
        sudo apt-get install -y rpm rpm2cpio cpio apksigner aapt
    - name: Download same-run attested aggregate
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -m scripts.release.artifacts --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --base "release-attestation-stable-$GITHUB_RUN_ID" --destination .work/attested-aggregate
    - name: Mint repository-scoped release App token
      id: release-app
      uses: ./.github/actions/release-app-token
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    - name: Create complete supported Draft release
      env:
        GH_TOKEN: ${{ steps.release-app.outputs.token }}
      run: python3 scripts/release/qualification.py draft --channel stable --root .work/collected
