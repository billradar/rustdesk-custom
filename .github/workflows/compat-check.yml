name: Reusable Patch and Build Compatibility
'on':
  workflow_call:
    inputs:
      upstream_repository:
        type: string
        default: rustdesk/rustdesk
      upstream_ref:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      channel:
        type: string
        required: true
    outputs:
      patchset:
        value: ${{ jobs.resolve.outputs.patchset }}
      upstream_version:
        value: ${{ jobs.resolve.outputs.upstream_version }}
      rust:
        value: ${{ jobs.resolve.outputs.rust }}
      flutter:
        value: ${{ jobs.resolve.outputs.flutter }}
      llvm:
        value: ${{ jobs.resolve.outputs.llvm }}
      vcpkg:
        value: ${{ jobs.resolve.outputs.vcpkg }}
      bridge_rust:
        value: ${{ jobs.resolve.outputs.bridge_rust }}
      bridge_flutter:
        value: ${{ jobs.resolve.outputs.bridge_flutter }}
      cargo_expand:
        value: ${{ jobs.resolve.outputs.cargo_expand }}
      frb:
        value: ${{ jobs.resolve.outputs.frb }}
      helper_commit:
        value: ${{ jobs.resolve.outputs.helper_commit }}
      signature:
        value: ${{ jobs.resolve.outputs.signature }}
      source_sbom_requested:
        value: ${{ jobs.resolve.outputs.source_sbom_requested }}
permissions:
  contents: read
env:
  AUTOMATION_MODE: '1'
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ inputs.upstream_sha }}
      tag: ${{ inputs.channel == 'stable' && inputs.upstream_ref || '' }}
      patchset: ${{ steps.selection.outputs.patchset }}
      upstream_version: ${{ steps.adapter.outputs.upstream_version }}
      rust: ${{ steps.adapter.outputs.rust }}
      flutter: ${{ steps.adapter.outputs.flutter }}
      llvm: ${{ steps.adapter.outputs.llvm }}
      vcpkg: ${{ steps.adapter.outputs.vcpkg }}
      bridge_rust: ${{ steps.adapter.outputs.bridge_rust }}
      bridge_flutter: ${{ steps.adapter.outputs.bridge_flutter }}
      cargo_expand: ${{ steps.adapter.outputs.cargo_expand }}
      frb: ${{ steps.adapter.outputs.frb }}
      helper_commit: ${{ steps.adapter.outputs.helper_commit }}
      signature: ${{ steps.adapter.outputs.signature }}
      source_sbom_requested: ${{ steps.adapter.outputs.source_sbom_requested }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements-build.txt
    - name: Scan tracked maintenance files for known CI credentials
      run: python3 scripts/scan_repository.py
    - name: Require exact official source identity
      env:
        UP_SHA: ${{ inputs.upstream_sha }}
        UP_REPO: ${{ inputs.upstream_repository }}
        CHANNEL: ${{ inputs.channel }}
      run: 'python3 - <<''PYCODE''

        import os,re

        assert os.environ[''UP_REPO'']==''rustdesk/rustdesk''

        assert re.fullmatch(''[0-9a-f]{40}'',os.environ[''UP_SHA''])

        assert os.environ[''CHANNEL''] in (''ci'',''stable'',''nightly'')

        PYCODE

        bash scripts/prepare.sh "$UP_SHA" .work/official'
    - id: adapter
      name: Fail-closed official build adapter
      run: python3 scripts/build_adapter.py .work/official --output .work/build-profile.json
    - id: selection
      name: Select compatible frozen patch generation
      run: 'source scripts/test-config.sh

        python3 scripts/patchsets.py "$UP_SHA" --source .work/official'
      env:
        UP_SHA: ${{ inputs.upstream_sha }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: patchset-selection-${{ github.run_id }}
        path: '.work/patchset-selection.json

          .work/build-profile.json'
        if-no-files-found: warn
  preflight:
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PATCHSET: ${{ needs.resolve.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_ref }}
      SIMULATE_FAILURE: 'false'
      SELECTED_VARIANT: both
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements-build.txt
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ needs.resolve.outputs.rust }}
    - name: Automation gate regression tests
      run: python3 -m unittest discover -s tests -v
    - name: Patch/API/config gate before expensive Windows dependencies
      run: 'source scripts/test-config.sh

        args=()

        if [[ "$SIMULATE_FAILURE" == true ]]; then args+=(--simulate-failure); fi

        python3 scripts/compatibility.py prepare --sha "$UPSTREAM_EXPECTED_SHA" --variant "$SELECTED_VARIANT" "${args[@]}"

        '
    - name: Real hbb_common configuration API compilation
      run: 'sudo apt-get update

        sudo apt-get install -y libssl-dev libx11-dev libxfixes-dev libxi-dev libxtst-dev pkg-config protobuf-compiler

        source scripts/test-config.sh

        python3 scripts/compatibility.py rust --variant "$SELECTED_VARIANT"

        '
    - name: Preserve diagnostics even on conflict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: preflight-report-${{ github.run_id }}
        path: '.work/validation/*.json

          .work/validation/*.md

          .work/validation/*.log

          '
        if-no-files-found: warn
        retention-days: 14
  bridge:
    needs:
    - resolve
    - preflight
    env:
      PATCHSET: ${{ needs.resolve.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_ref }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements-build.txt
    - name: Validate selection and load fictional fixtures
      id: selection
      env:
        SELECTED_VARIANT: both
      shell: bash
      run: "python3 - <<'PY'\nimport json, os\nselected = os.environ['SELECTED_VARIANT']\nif selected not in ('both', 'standard',\
        \ 'sos'):\n    raise SystemExit('Invalid variant')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as f:\n    f.write('matrix='\
        \ + json.dumps({'variant': ['standard', 'sos'] if selected == 'both' else [selected]}) + '\\n')\nPY\nsource scripts/test-config.sh\n\
        python3 - <<'PY'\nimport os\nwith open(os.environ['GITHUB_ENV'], 'a') as f:\n    for key in ('RUSTDESK_ID_SERVER',\
        \ 'RUSTDESK_RELAY_SERVER', 'RUSTDESK_API_SERVER', 'RUSTDESK_KEY', 'RUSTDESK_PASSWORD'):\n        f.write(key + '='\
        \ + os.environ[key] + '\\n')\nPY\n"
    - name: Prepare exact official source
      env:
        UPSTREAM_REF: ${{ needs.resolve.outputs.sha }}
      run: bash scripts/prepare.sh "$UPSTREAM_REF" .work/bridge
    - name: Install official bridge prerequisites
      run: 'sudo apt-get update

        sudo apt-get install -y clang cmake libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config

        '
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ needs.resolve.outputs.bridge_rust }}
        components: rustfmt
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: ${{ needs.resolve.outputs.bridge_flutter }}
        channel: stable
    - name: Generate bridge using official baseline recipe
      working-directory: .work/bridge
      run: 'cargo install cargo-expand --version "$CARGO_EXPAND" --locked

        cargo install flutter_rust_bridge_codegen --version "$FRB" --features uuid --locked

        sed -i ''s/extended_text: 14.0.0/extended_text: 13.0.0/g'' flutter/pubspec.yaml

        (cd flutter && flutter pub get)

        flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output
        ./flutter/macos/Runner/bridge_generated.h

        cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h

        python3 ../../scripts/package.py bridge-info .

        '
      env:
        CARGO_EXPAND: ${{ needs.resolve.outputs.cargo_expand }}
        FRB: ${{ needs.resolve.outputs.frb }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-bridge-${{ github.run_id }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        path: '.work/bridge/src/bridge_generated*.rs

          .work/bridge/flutter/lib/generated_bridge*.dart

          .work/bridge/flutter/macos/Runner/bridge_generated.h

          .work/bridge/flutter/ios/Runner/bridge_generated.h

          .work/bridge/bridge-info.json

          '
    - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        flutter-version: ${{ needs.resolve.outputs.flutter }}
        channel: stable
    - name: Analyze patched Flutter interfaces against generated bridge
      env:
        SELECTED_VARIANT: both
      run: "source scripts/test-config.sh\npython3 scripts/compatibility.py prepare --sha \"$UPSTREAM_EXPECTED_SHA\" --variant\
        \ \"$SELECTED_VARIANT\"\nfor variant in standard sos; do\n  [[ \"$SELECTED_VARIANT\" == both || \"$SELECTED_VARIANT\"\
        \ == \"$variant\" ]] || continue\n  python3 scripts/package.py restore-bridge \".work/validation/$variant\" .work/bridge\n\
        done\npython3 scripts/compatibility.py analyze --variant \"$SELECTED_VARIANT\"\n"
    - name: Preserve Flutter compatibility diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: flutter-compatibility-report-${{ github.run_id }}
        path: '.work/validation/*.json

          .work/validation/*.md

          .work/validation/*.log

          '
        if-no-files-found: warn
        retention-days: 14
  validation-report:
    needs:
    - resolve
    - preflight
    - bridge
    if: always()
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: '*report-${{ github.run_id }}'
        path: diagnostics
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: patchset-selection-${{ github.run_id }}
        path: diagnostics/selection
    - name: Report generation and actual compile coverage
      env:
        SELECTED: ${{ needs.resolve.outputs.patchset }}
        PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        BRIDGE_RESULT: ${{ needs.bridge.result }}
      run: "python3 - <<'PYCODE'\nimport json,os\nfrom pathlib import Path\nroots=list(Path('diagnostics').rglob('patchset-selection.json'))\n\
        report=json.loads(roots[0].read_text()) if roots else {'selected':None,'patchsets':[]}\npassed=os.environ['PREFLIGHT_RESULT']=='success'\
        \ and os.environ['BRIDGE_RESULT']=='success'\nreport['overall']='PASS' if passed else 'FAIL'\nreport['Rust fast check']='PASS'\
        \ if os.environ['PREFLIGHT_RESULT']=='success' else 'NOT PASSED'\nreport['Flutter Analyze']='PASS' if os.environ['BRIDGE_RESULT']=='success'\
        \ else 'NOT PASSED'\nreport['Bridge']='PASS' if os.environ['BRIDGE_RESULT']=='success' else 'NOT PASSED'\nfor item\
        \ in report['patchsets']:\n    if item['patchset']==os.environ['SELECTED']:\n        item['full_compatibility']='COMPATIBLE'\
        \ if passed else 'NOT VALIDATED'\nPath('compatibility-report.json').write_text(json.dumps(report,indent=2)+'\\n')\n\
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:\n    f.write('## Patch Generation Compatibility\\n```json\\\
        n'+json.dumps(report,indent=2)+'\\n```\\n')\nPYCODE\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: generation-compatibility-${{ github.run_id }}
        path: compatibility-report.json
