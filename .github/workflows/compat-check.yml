name: Reusable Patch and Build Compatibility
env:
  PYTHONPATH: .
  AUTOMATION_MODE: '1'
'on':
  workflow_call:
    inputs:
      upstream_repository:
        type: string
        default: rustdesk/rustdesk
      upstream_ref:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      channel:
        type: string
        required: true
    outputs:
      patchset:
        value: ${{ jobs.resolve.outputs.patchset }}
      upstream_version:
        value: ${{ jobs.resolve.outputs.upstream_version }}
      rust:
        value: ${{ jobs.resolve.outputs.rust }}
      flutter:
        value: ${{ jobs.resolve.outputs.flutter }}
      llvm:
        value: ${{ jobs.resolve.outputs.llvm }}
      vcpkg:
        value: ${{ jobs.resolve.outputs.vcpkg }}
      bridge_rust:
        value: ${{ jobs.resolve.outputs.bridge_rust }}
      bridge_flutter:
        value: ${{ jobs.resolve.outputs.bridge_flutter }}
      cargo_expand:
        value: ${{ jobs.resolve.outputs.cargo_expand }}
      frb:
        value: ${{ jobs.resolve.outputs.frb }}
      helper_commit:
        value: ${{ jobs.resolve.outputs.helper_commit }}
      signature:
        value: ${{ jobs.resolve.outputs.signature }}
      source_sbom_requested:
        value: ${{ jobs.resolve.outputs.source_sbom_requested }}
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve official source and patchset
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ inputs.upstream_sha }}
      tag: ${{ inputs.channel == 'stable' && inputs.upstream_ref || '' }}
      patchset: ${{ steps.selection.outputs.patchset }}
      upstream_version: ${{ steps.adapter.outputs.upstream_version }}
      rust: ${{ steps.adapter.outputs.rust }}
      flutter: ${{ steps.adapter.outputs.flutter }}
      llvm: ${{ steps.adapter.outputs.llvm }}
      vcpkg: ${{ steps.adapter.outputs.vcpkg }}
      bridge_rust: ${{ steps.adapter.outputs.bridge_rust }}
      bridge_flutter: ${{ steps.adapter.outputs.bridge_flutter }}
      cargo_expand: ${{ steps.adapter.outputs.cargo_expand }}
      frb: ${{ steps.adapter.outputs.frb }}
      helper_commit: ${{ steps.adapter.outputs.helper_commit }}
      signature: ${{ steps.adapter.outputs.signature }}
      source_sbom_requested: ${{ steps.adapter.outputs.source_sbom_requested }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - name: Validate explicit platform policies
      run: python3 scripts/release/qualification.py check
    - name: Scan tracked maintenance files for known CI credentials
      run: python3 scripts/validation/scan_repository.py
    - name: Require exact official source identity
      env:
        UP_SHA: ${{ inputs.upstream_sha }}
        UP_REPO: ${{ inputs.upstream_repository }}
        CHANNEL: ${{ inputs.channel }}
      run: 'python3 - <<''PYCODE''

        import os,re

        assert os.environ[''UP_REPO'']==''rustdesk/rustdesk''

        assert re.fullmatch(''[0-9a-f]{40}'',os.environ[''UP_SHA''])

        assert os.environ[''CHANNEL''] in (''ci'',''stable'',''nightly'')

        PYCODE

        bash scripts/source/prepare.sh "$UP_SHA" .work/official'
    - id: adapter
      name: Fail-closed official build adapter
      run: python3 scripts/build/build_adapter.py .work/official --output .work/build-profile.json
    - id: selection
      name: Select compatible frozen patch generation
      run: 'source scripts/validation/test_config.sh

        python3 scripts/upstream/patchsets.py "$UP_SHA" --source .work/official'
      env:
        UP_SHA: ${{ inputs.upstream_sha }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: patchset-selection-${{ github.run_id }}
        path: '.work/patchset-selection.json

          .work/build-profile.json'
        if-no-files-found: warn
  contracts:
    name: Repository architecture contracts
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - name: Run repository architecture contract
      run: python3 scripts/validation/repository_contract.py
    - name: Run release and domain contracts
      run: |
        set -euo pipefail
        python3 scripts/release/production_contract.py
        python3 scripts/release/qualification_contract.py
        python3 scripts/release/channel_contract.py
        python3 scripts/build/config_mir_contract.py
        python3 scripts/validation/native_config_contract.py
        python3 scripts/signing/android_signing_contract.py
  preflight:
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PATCHSET: ${{ needs.resolve.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_ref }}
      SIMULATE_FAILURE: 'false'
      SELECTED_VARIANT: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ needs.resolve.outputs.rust }}
    - name: Patch/API/config gate before expensive Windows dependencies
      run: 'source scripts/validation/test_config.sh

        args=()

        if [[ "$SIMULATE_FAILURE" == true ]]; then args+=(--simulate-failure); fi

        python3 scripts/validation/compatibility.py prepare --sha "$UPSTREAM_EXPECTED_SHA" --variant "$SELECTED_VARIANT" "${args[@]}"

        '
    - name: Real hbb_common configuration API compilation
      run: 'sudo apt-get update

        sudo apt-get install -y libssl-dev libx11-dev libxfixes-dev libxi-dev libxtst-dev pkg-config protobuf-compiler

        source scripts/validation/test_config.sh

        python3 scripts/validation/compatibility.py rust --variant "$SELECTED_VARIANT"

        '
    - name: Preserve diagnostics even on conflict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: preflight-${{ matrix.variant }}-report-${{ github.run_id }}
        path: '.work/validation/*.json

          .work/validation/*.md

          .work/validation/*.log

          '
        if-no-files-found: warn
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        variant:
        - standard
        - sos
  bridge:
    needs:
    - resolve
    env:
      PATCHSET: ${{ needs.resolve.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_ref }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - name: Load fictional bridge fixtures
      shell: bash
      run: "source scripts/validation/test_config.sh\npython3 - <<'PYCODE'\nimport os\nwith open(os.environ['GITHUB_ENV'],'a') as f:\n\
        \ for key in ('RUSTDESK_ID_SERVER','RUSTDESK_RELAY_SERVER','RUSTDESK_API_SERVER','RUSTDESK_KEY','RUSTDESK_PASSWORD'):\n\
        \  f.write(key+'='+os.environ[key]+'\\n')\nPYCODE"
    - name: Prepare exact official source
      env:
        UPSTREAM_REF: ${{ needs.resolve.outputs.sha }}
      run: bash scripts/source/prepare.sh "$UPSTREAM_REF" .work/bridge
    - name: Install official bridge prerequisites
      run: 'sudo apt-get update

        sudo apt-get install -y clang cmake libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config

        '
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ needs.resolve.outputs.bridge_rust }}
        components: rustfmt
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: ${{ needs.resolve.outputs.bridge_flutter }}
        channel: stable
    - name: Generate bridge using official baseline recipe
      working-directory: .work/bridge
      run: 'cargo install cargo-expand --version "$CARGO_EXPAND" --locked

        cargo install flutter_rust_bridge_codegen --version "$FRB" --features uuid --locked

        sed -i ''s/extended_text: 14.0.0/extended_text: 13.0.0/g'' flutter/pubspec.yaml

        (cd flutter && flutter pub get)

        flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output
        ./flutter/macos/Runner/bridge_generated.h

        cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h

        python3 ../../scripts/release/package.py bridge-info .

        '
      env:
        CARGO_EXPAND: ${{ needs.resolve.outputs.cargo_expand }}
        FRB: ${{ needs.resolve.outputs.frb }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-bridge-${{ github.run_id }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        path: '.work/bridge/src/bridge_generated*.rs

          .work/bridge/flutter/lib/generated_bridge*.dart

          .work/bridge/flutter/macos/Runner/bridge_generated.h

          .work/bridge/flutter/ios/Runner/bridge_generated.h

          .work/bridge/bridge-info.json

          '
  windows-helper:
    needs: resolve
    if: inputs.channel != 'ci'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      HELPER_SHA: ${{ needs.resolve.outputs.helper_commit }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
    - name: Build pinned WindowInjection once for both variants
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow .work/topmost

        if ($LASTEXITCODE -ne 0) { throw ''WindowInjection clone failed'' }

        git -C .work/topmost checkout --detach $env:HELPER_SHA

        if ($LASTEXITCODE -ne 0) { throw ''WindowInjection checkout failed'' }

        Push-Location .work/topmost

        & MSBuild.exe WindowInjection/WindowInjection.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10

        if ($LASTEXITCODE -ne 0) { throw ''WindowInjection build failed'' }

        Pop-Location

        '
    - name: Bind helper digest to source and architecture
      shell: bash
      run: 'python3 - <<''PYCODE''

        import hashlib,json,os,struct

        from pathlib import Path

        p=Path(''.work/topmost/WindowInjection/x64/Release/WindowInjection.dll'')

        b=p.read_bytes();off=struct.unpack_from(''<I'',b,0x3c)[0]

        assert b[:2]==b''MZ'' and b[off:off+4]==b''PE\0\0'' and struct.unpack_from(''<H'',b,off+4)[0]==0x8664

        info={''upstream_sha'':os.environ[''UPSTREAM_EXPECTED_SHA''],''helper_commit'':os.environ[''HELPER_SHA''],''architecture'':''x86_64'',''sha256'':hashlib.sha256(b).hexdigest(),''workflow_run'':os.environ[''GITHUB_RUN_ID'']}

        Path(''.work/topmost/helper-info.json'').write_text(json.dumps(info,indent=2)+''\n'')

        PYCODE

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-helper-${{ github.run_id }}
        path: '.work/topmost/WindowInjection/x64/Release/WindowInjection.dll

          .work/topmost/helper-info.json'
        if-no-files-found: error
        retention-days: 7
  flutter-analyze:
    needs:
    - resolve
    - bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
        - standard
        - sos
    env:
      PATCHSET: ${{ needs.resolve.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_ref }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Install reviewed workflow parser
      run: python3 -m pip install -r requirements.txt
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ needs.resolve.outputs.rust }}
    - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        flutter-version: ${{ needs.resolve.outputs.flutter }}
        channel: stable
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: test-bridge-${{ github.run_id }}
        path: .work/bridge
    - name: Analyze patched Flutter interfaces against generated bridge
      env:
        SELECTED_VARIANT: ${{ matrix.variant }}
      run: "source scripts/validation/test_config.sh\npython3 scripts/validation/compatibility.py prepare --sha \"$UPSTREAM_EXPECTED_SHA\" --variant\
        \ \"$SELECTED_VARIANT\"\nfor variant in standard sos; do\n  [[ \"$SELECTED_VARIANT\" == both || \"$SELECTED_VARIANT\"\
        \ == \"$variant\" ]] || continue\n  python3 scripts/release/package.py restore-bridge \".work/validation/$variant\" .work/bridge\n\
        done\npython3 scripts/validation/compatibility.py analyze --variant \"$SELECTED_VARIANT\"\n"
    - name: Preserve Flutter compatibility diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: flutter-${{ matrix.variant }}-report-${{ github.run_id }}
        path: '.work/validation/*.json

          .work/validation/*.md

          .work/validation/*.log

          '
        if-no-files-found: warn
        retention-days: 14
  validation-report:
    needs:
    - resolve
    - contracts
    - preflight
    - bridge
    - flutter-analyze
    - windows-helper
    if: always()
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        pattern: '*report-${{ github.run_id }}'
        path: diagnostics
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: patchset-selection-${{ github.run_id }}
        path: diagnostics/selection
    - name: Report generation and actual compile coverage
      env:
        SELECTED: ${{ needs.resolve.outputs.patchset }}
        PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        BRIDGE_RESULT: ${{ needs.bridge.result }}
        FLUTTER_RESULT: ${{ needs.flutter-analyze.result }}
        HELPER_RESULT: ${{ needs.windows-helper.result }}
        CONTRACT_RESULT: ${{ needs.contracts.result }}
        CHANNEL: ${{ inputs.channel }}
      run: "python3 - <<'PYCODE'\nimport json,os\nfrom pathlib import Path\nroots=list(Path('diagnostics').rglob('patchset-selection.json'))\n\
        report=json.loads(roots[0].read_text()) if roots else {'selected':None,'patchsets':[]}\npassed=(os.environ['CONTRACT_RESULT']=='success' and os.environ['PREFLIGHT_RESULT']=='success'\
        \ and os.environ['BRIDGE_RESULT']=='success' and os.environ['FLUTTER_RESULT']=='success' and (os.environ['CHANNEL']=='ci'\
        \ or os.environ['HELPER_RESULT']=='success'))\nreport['overall']='PASS' if passed else 'FAIL'\nreport['Rust fast check']='PASS'\
        \ if os.environ['PREFLIGHT_RESULT']=='success' else 'NOT PASSED'\nreport['Flutter Analyze']='PASS' if os.environ['FLUTTER_RESULT']=='success'\
        \ else 'NOT PASSED'\nreport['Bridge']='PASS' if os.environ['BRIDGE_RESULT']=='success' else 'NOT PASSED'\nreport['Windows\
        \ helper']='N/A (CI)' if os.environ['CHANNEL']=='ci' else ('PASS' if os.environ['HELPER_RESULT']=='success' else 'NOT\
        \ PASSED')\nfor item in report['patchsets']:\n    if item['patchset']==os.environ['SELECTED']:\n        item['full_compatibility']='COMPATIBLE'\
        \ if passed else 'NOT VALIDATED'\nPath('compatibility-report.json').write_text(json.dumps(report,indent=2)+'\\n')\n\
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:\n    f.write('## Patch Generation Compatibility\\n```json\\\
        n'+json.dumps(report,indent=2)+'\\n```\\n')\nPYCODE\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: generation-compatibility-${{ github.run_id }}
        path: compatibility-report.json
