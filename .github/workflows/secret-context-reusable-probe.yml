name: Reusable Environment Secret Visibility Probe
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reusable-probe:
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/secret-context-reusable-probe.yml@refs/heads/main'
    uses: ./.github/workflows/secret-context-reusable-probe-job.yml
    secrets:
      SECRET_CONTEXT_PROBE_2: ${{ secrets.SECRET_CONTEXT_PROBE_2 }}
