name: Reusable Android YubiKey Production Signing
'on':
  workflow_call:
    inputs:
      arches: {type: string, required: true}
      channel: {type: string, required: true}
      upstream_sha: {type: string, required: true}
      upstream_version: {type: string, required: true}
      patchset: {type: string, required: true}
    secrets:
      YUBIKEY_PIV_PIN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  sign:
    if: >-
      github.repository == 'billradar/rustdesk-custom' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'billradar/rustdesk-custom/.github/workflows/tag.yml@refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      inputs.channel == 'stable'
    name: Sign Android production artifacts with YubiKey PIV 9C
    runs-on:
      - self-hosted
      - linux
      - arm64
      - rustdesk-signing
      - android-signing
      - yubikey
    environment:
      name: android-production-signing
    concurrency:
      group: rustdesk-android-yubikey-signing
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    env:
      UPSTREAM_EXPECTED_SHA: ${{ inputs.upstream_sha }}
      UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      PATCHSET: ${{ inputs.patchset }}
      ARCHES: ${{ inputs.arches }}
    steps:
      - name: Validate public YubiKey identity metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; from pathlib import Path; i=json.loads(Path("metadata/yubikey-android-signing-identity.json").read_text()); assert i["certificate_sha256"] == "559c1ede0fbe3a01f29bcac9d0b34bd9691df3562c83e3019a930506fbc7b6f5"; assert i["piv_slot"] == "9C" and i["pkcs11_id"] == "02"; assert i["legacy_android_signing_identity"] == "NOT RECOVERED / NOT VALIDATED"; print("YubiKey identity metadata: PASS")'

      - name: Download Android aarch64 build artifact
        if: contains(inputs.arches, 'aarch64')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: android-build-input-${{ inputs.channel }}-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-standard-android-aarch64
          path: .work/android-input/aarch64
      - name: Download Android armv7 build artifact
        if: contains(inputs.arches, 'armv7')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: android-build-input-${{ inputs.channel }}-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-standard-android-armv7
          path: .work/android-input/armv7
      - name: Download Android x86_64 build artifact
        if: contains(inputs.arches, 'x86_64')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: android-build-input-${{ inputs.channel }}-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-standard-android-x86_64
          path: .work/android-input/x86_64

      - name: Validate all Android inputs before touching the YubiKey
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path

          arches = [x.strip() for x in os.environ["ARCHES"].split(",") if x.strip()]
          expected_arches = {
              "aarch64": "arm64-v8a",
              "armv7": "armeabi-v7a",
              "x86_64": "x86_64",
          }
          if set(arches) != set(expected_arches):
              raise SystemExit("SIGNING: expected exactly aarch64, armv7 and x86_64")
          root = Path(".work/android-input").resolve()

          for arch in arches:
              input_root = (root / arch).resolve()
              manifests = list(input_root.rglob("build-info.json"))
              if len(manifests) != 1:
                  raise SystemExit(f"SIGNING[{arch}]: expected exactly one build manifest")
              bundle = manifests[0].parent.resolve()
              if not bundle.is_relative_to(input_root):
                  raise SystemExit(f"SIGNING[{arch}]: artifact path escaped its root")
              for path in bundle.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit(f"SIGNING[{arch}]: symlink in downloaded artifact")

              required = ["SHA256SUMS", "source-manifest.json", "validation/librustdesk.so"]
              if any(not (bundle / name).is_file() for name in required):
                  raise SystemExit(f"SIGNING[{arch}]: incomplete Android build artifact")
              subprocess.run(
                  ["sha256sum", "-c", "SHA256SUMS"],
                  cwd=bundle, check=True,
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )

              info = json.loads((bundle / "build-info.json").read_text())
              source = json.loads((bundle / "source-manifest.json").read_text())
              expected = {
                  "platform": "android",
                  "variant": "standard",
                  "architecture": arch,
                  "package_type": "debug-signed-apk",
                  "signed_status": "TEST SIGNED / NOT PRODUCTION SIGNED",
                  "custom_repository": os.environ["GITHUB_REPOSITORY"],
                  "custom_repository_sha": os.environ["GITHUB_SHA"],
                  "upstream_sha": os.environ["UPSTREAM_EXPECTED_SHA"],
                  "upstream_version": os.environ["UPSTREAM_VERSION"],
                  "patchset": os.environ["PATCHSET"],
                  "build_run": os.environ["GITHUB_RUN_ID"],
                  "workflow_run": os.environ["GITHUB_RUN_ID"],
              }
              for key, value in expected.items():
                  if str(info.get(key)) != str(value):
                      raise SystemExit(f"SIGNING[{arch}]: build artifact provenance mismatch: {key}")
              for key in ("upstream_sha", "upstream_version", "patchset", "custom_repository_sha", "variant"):
                  if source.get(key) != info.get(key):
                      raise SystemExit(f"SIGNING[{arch}]: prepared source provenance mismatch: {key}")
              if hashlib.sha256((bundle / "source-manifest.json").read_bytes()).hexdigest() != info.get("prepared_source_identity"):
                  raise SystemExit(f"SIGNING[{arch}]: prepared source identity checksum mismatch")
              if str(source.get("prepare_workflow_run")) != str(info.get("prepare_run")):
                  raise SystemExit(f"SIGNING[{arch}]: prepare/source-build run mismatch")
              if str(info.get("prepare_run")) != str(info.get("build_run")):
                  raise SystemExit(f"SIGNING[{arch}]: prepare/build run mismatch")
              if str(info.get("build_run")) != os.environ["GITHUB_RUN_ID"]:
                  raise SystemExit(f"SIGNING[{arch}]: build/current workflow run mismatch")
              packages = list((bundle / "packages").glob("*.apk"))
              if len(packages) != 1:
                  raise SystemExit(f"SIGNING[{arch}]: expected exactly one input APK")
              apk = packages[0].resolve()
              if not apk.is_relative_to(bundle):
                  raise SystemExit(f"SIGNING[{arch}]: APK path escaped artifact bundle")
              if subprocess.run(
                  ["apksigner", "verify", "--verbose", str(apk)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode:
                  raise SystemExit(f"SIGNING[{arch}]: input APK signature verification failed")
              badging = subprocess.run(
                  ["aapt", "dump", "badging", str(apk)],
                  check=True, capture_output=True, text=True,
              ).stdout
              match = re.search(
                  r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']*)'",
                  badging, re.M,
              )
              if not match or match.group(1) != "com.carriez.flutter_hbb":
                  raise SystemExit(f"SIGNING[{arch}]: unexpected Android package identity")
              abi = expected_arches[arch]
              with zipfile.ZipFile(apk) as archive:
                  native = "lib/" + abi + "/librustdesk.so"
                  if native not in archive.namelist() or archive.read(native) != (bundle / "validation/librustdesk.so").read_bytes():
                      raise SystemExit(f"SIGNING[{arch}]: APK ABI does not match validated build output")
              digest = hashlib.sha256(apk.read_bytes()).hexdigest()
              print(f"{arch}: unsigned APK SHA-256: {digest}")
              print(f"{arch}: artifact, source, package, ABI and checksum gates: PASS")
          PY

      - name: Production YubiKey signing of all Android architectures
        env:
          YUBIKEY_PIV_PIN: ${{ secrets.YUBIKEY_PIV_PIN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          if [[ -z "${YUBIKEY_PIV_PIN:-}" ]]; then
            printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: FAIL'
            exit 1
          fi
          printf '%s\n' 'ENVIRONMENT PIN AVAILABLE: PASS'
          mkdir -p .work/signed

          python3 - <<'PY'
          import json, os, subprocess, shutil
          from pathlib import Path

          arches = [x.strip() for x in os.environ["ARCHES"].split(",") if x.strip()]
          root = Path(".work/android-input").resolve()
          signed_root = Path(".work/signed").resolve()
          for arch in arches:
              input_root = (root / arch).resolve()
              manifests = list(input_root.rglob("build-info.json"))
              bundle = manifests[0].parent.resolve()
              apk = next((bundle / "packages").glob("*.apk")).resolve()
              out_dir = Path(os.environ["RUNNER_TEMP"]) / f"rustdesk-yubikey-signing-{arch}"
              if out_dir.exists():
                  shutil.rmtree(out_dir)
              out_dir.mkdir(mode=0o700, parents=True)
              out_apk = out_dir / "signed.apk"
              print(f"Signing {arch} with YubiKey PIV 9C...")
              subprocess.run([
                  "/usr/local/bin/rustdesk-sign",
                  "--input", str(apk),
                  "--output", str(out_apk),
                  "--pin-source", "env",
              ], check=True, env=os.environ.copy())
              out_apk.chmod(0o600)
              destination = signed_root / arch
              if destination.exists():
                  shutil.rmtree(destination)
              shutil.copytree(bundle, destination, symlinks=False)
              packages = destination / "packages"
              for item in packages.iterdir():
                  if item.is_dir():
                      shutil.rmtree(item)
                  else:
                      item.unlink()
              shutil.copy2(out_apk, packages / f"standard-android-{arch}-signed.apk")
              print(f"{arch}: YubiKey signing completed")
          PY

      - name: Verify all production signatures and assemble verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path

          expected_fingerprint = "559c1ede0fbe3a01f29bcac9d0b34bd9691df3562c83e3019a930506fbc7b6f5"
          expected_package = "com.carriez.flutter_hbb"
          abi_by_arch = {
              "aarch64": "arm64-v8a",
              "armv7": "armeabi-v7a",
              "x86_64": "x86_64",
          }
          arches = [x.strip() for x in os.environ["ARCHES"].split(",") if x.strip()]
          signed_root = Path(".work/signed").resolve()

          for arch in arches:
              destination = signed_root / arch
              signed = next((destination / "packages").glob("*.apk")).resolve()
              result = subprocess.run(
                  ["apksigner", "verify", "--verbose", "--print-certs", str(signed)],
                  check=True, capture_output=True, text=True,
              )
              certs = re.findall(
                  r"^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$",
                  result.stdout, re.M,
              )
              if len(certs) != 1 or certs[0].lower() != expected_fingerprint:
                  raise SystemExit(f"SIGNING[{arch}]: signer certificate fingerprint mismatch")
              schemes = [int(value) for value in re.findall(
                  r"^Verified using v([123]) scheme.*: true$", result.stdout, re.M
              )]
              if not any(scheme in (2, 3) for scheme in schemes):
                  raise SystemExit(f"SIGNING[{arch}]: APK lacks a verified v2 or v3 signature")
              badging = subprocess.run(
                  ["aapt", "dump", "badging", str(signed)],
                  check=True, capture_output=True, text=True,
              ).stdout
              match = re.search(
                  r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']*)'",
                  badging, re.M,
              )
              if not match or match.group(1) != expected_package:
                  raise SystemExit(f"SIGNING[{arch}]: signed APK package identity mismatch")
              abi = abi_by_arch[arch]
              with zipfile.ZipFile(signed) as archive:
                  native = "lib/" + abi + "/librustdesk.so"
                  if native not in archive.namelist() or archive.read(native) != (destination / "validation/librustdesk.so").read_bytes():
                      raise SystemExit(f"SIGNING[{arch}]: signed APK ABI differs from validated build output")
              info = json.loads((destination / "build-info.json").read_text())
              info.update(
                  signed=True,
                  signing_identity_verified=True,
                  certificate_sha256=certs[0].lower(),
                  package_name=match.group(1),
                  version_code=int(match.group(2)),
                  version_name=match.group(3),
                  signing_schemes=schemes,
                  signed_status="PRODUCTION SIGNED / IDENTITY VERIFIED",
                  package_type="production-signed-apk",
                  signing_method="yubikey-piv-9c-pkcs11",
                  signing_run=os.environ["GITHUB_RUN_ID"],
                  legacy_android_signing_identity="NOT RECOVERED / NOT VALIDATED",
              )
              (destination / "build-info.json").write_text(json.dumps(info, indent=2) + "\n")
              receipt = {
                  "certificate_sha256": certs[0].lower(),
                  "expected_certificate_sha256": expected_fingerprint,
                  "certificate_match": "PASS",
                  "package_name": match.group(1),
                  "version_code": int(match.group(2)),
                  "version_name": match.group(3),
                  "abis": [abi],
                  "apk_sha256": hashlib.sha256(signed.read_bytes()).hexdigest(),
                  "signature_verification": "PASS",
                  "signing_schemes": schemes,
                  "signing_method": "yubikey-piv-9c-pkcs11",
                  "piv_slot": "9C",
                  "pkcs11_id": "02",
                  "key_algorithm": "EC",
                  "curve": "secp384r1",
                  "workflow_run": os.environ["GITHUB_RUN_ID"],
                  "custom_repository_sha": os.environ["GITHUB_SHA"],
                  "legacy_android_signing_identity": "NOT RECOVERED / NOT VALIDATED",
              }
              (destination / "android-signing-verification.json").write_text(json.dumps(receipt, indent=2) + "\n")
              rows = []
              for path in sorted(destination.rglob("*")):
                  if path.is_file() and path.name != "SHA256SUMS":
                      rows.append(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.relative_to(destination).as_posix())
              (destination / "SHA256SUMS").write_text("\n".join(rows) + "\n")
              print(f"{arch}: certificate={certs[0].lower()}")
              print(f"{arch}: APK signature, fingerprint, package, ABI and provenance gates: PASS")
          PY

      - name: Upload verified aarch64 production artifact
        if: contains(inputs.arches, 'aarch64')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-${{ inputs.channel }}-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-standard-android-aarch64
          path: .work/signed/aarch64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified armv7 production artifact
        if: contains(inputs.arches, 'armv7')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-${{ inputs.channel }}-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-standard-android-armv7
          path: .work/signed/armv7/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified x86_64 production artifact
        if: contains(inputs.arches, 'x86_64')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-${{ inputs.channel }}-${{ inputs.upstream_version }}-${{ inputs.upstream_sha }}-standard-android-x86_64
          path: .work/signed/x86_64/
          if-no-files-found: error
          retention-days: 14

      - name: Remove downloaded and signed workspace artifacts
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(".work")
          for path in (root / "android-input", root / "signed"):
              if path.exists():
                  shutil.rmtree(path)
          for path in Path(os.environ["RUNNER_TEMP"]).glob("rustdesk-yubikey-signing-*"):
              if path.exists():
                  shutil.rmtree(path)
          PY
