name: Staging v4 upstream 97245124 patch applicability
on:
  pull_request:
    paths:
      - '.github/workflows/staging-v4-97245124.yml'
      - 'patchsets/v4/**'
      - 'metadata/patch-profiles.json'
      - 'scripts/upstream/patchsets.py'
      - 'scripts/source/apply_patches.sh'
      - 'scripts/source/verify_source.py'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  patch-check:
    name: Check v4 ${{ matrix.variant }} (no publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, sos]
    env:
      PYTHONPATH: .
      UPSTREAM_SHA: 9724512429b053be04cdb843345e99ddcccdb80e
      EXPECTED_HBB: 450cc1d7b729cfa8d19b5a7527c9cc2fe54cf5eb
      PATCHSET: v4
      BUILD_CHANNEL: ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify candidate metadata, changelog and selection contracts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upstream/patchsets.py scripts/source/verify_source.py
          python3 -m scripts.upstream.source_profile_contract
          python3 - <<'PY'
          from scripts.upstream.patchsets import verify
          from scripts.upstream.patchset_version import current
          data=verify('v4')
          assert data['status']=='candidate_only'
          assert data['baseline']['hbb_common_sha']=='450cc1d7b729cfa8d19b5a7527c9cc2fe54cf5eb'
          current('v4')
          print('v4 integrity and candidate policy: PASS')
          PY
      - name: Prepare exact official RustDesk source and submodule
        run: |
          set -euo pipefail
          UPSTREAM_EXPECTED_SHA="$UPSTREAM_SHA" bash scripts/source/prepare.sh "$UPSTREAM_SHA" .work/v4/source
          test "$(git -C .work/v4/source/libs/hbb_common rev-parse HEAD)" = "$EXPECTED_HBB"
      - name: Enforce SHA-specific, CI-only Patch Profile
        run: |
          set -euo pipefail
          python3 scripts/upstream/patchsets.py "$UPSTREAM_SHA" --source .work/v4/source --channel ci --report .work/v4/selection.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('.work/v4/selection.json').read_text())
          assert data['selected']=='v4' and data['source_match']
          assert not data['stable_allowed'] and data['compatibility_test_only']
          print('Exact source v4 candidate routing: PASS')
          PY
          if python3 scripts/upstream/patchsets.py "$UPSTREAM_SHA" --source .work/v4/source --channel stable; then
            echo 'STOP: unapproved candidate was admitted to Stable' >&2
            exit 1
          fi
      - name: Apply patches sequentially (fail closed)
        run: |
          set -euo pipefail
          source scripts/validation/test_config.sh
          bash scripts/source/apply_patches.sh .work/v4/source "${{ matrix.variant }}"
          python3 scripts/source/verify_source.py .work/v4/source "${{ matrix.variant }}" --automation
          grep -q 'Err(err) => last_error = Some(err)' .work/v4/source/libs/hbb_common/src/tcp.rs
          grep -q 'err.context(message)' .work/v4/source/libs/hbb_common/src/tcp.rs
          grep -q 'Action::DnsResolve' .work/v4/source/libs/hbb_common/src/tcp.rs
          grep -q 'Action::ProxyConnect' .work/v4/source/libs/hbb_common/src/tcp.rs
          echo 'Patch application and upstream TCP error preservation: PASS'
