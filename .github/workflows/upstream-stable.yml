name: Upstream Stable Router
'on':
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
    inputs:
      allow_same_version:
        description: 'Allow a same-version Stable build when its patch/config identity changed'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: upstream-stable-router
  cancel-in-progress: false
jobs:
  route:
    if: github.repository == 'billradar/rustdesk-custom' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write # Required to inspect unpublished GitHub Release drafts
      actions: write # Required to dispatch tag.yml
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      ANDROID_PRODUCTION_SIGNING_ENABLED: ${{ vars.ANDROID_PRODUCTION_SIGNING_ENABLED || 'false' }}
      ALLOW_SAME_VERSION: ${{ inputs.allow_same_version || 'false' }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - run: python3 -m pip install -r requirements.txt
    - name: Validate Stable router contracts
      run: python3 -m scripts.release.stable_router_contract
    - name: Follow official Stable release and dispatch qualified private draft
      run: python3 -m scripts.release.stable_router
