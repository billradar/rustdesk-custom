name: Patchset content version contract
'on':
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Verify content revision against current base
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Run offline allocation contracts
      run: python3 -m scripts.upstream.patchset_version_contract
    - name: Verify current manifests and reviewed changelogs
      env:
        BASE_REF: ${{ github.base_ref || 'main' }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == pull_request ]]; then
          git fetch origin "$BASE_REF"
          python3 -m scripts.upstream.patchset_version verify --base FETCH_HEAD --check
        else
          python3 -m scripts.upstream.patchset_version render --check
        fi
