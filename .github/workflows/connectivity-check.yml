name: Diagnostics - Server connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: DNS TCP and HTTPS transport only
        env:
          ID_SERVER: ${{ vars.RUSTDESK_ID_SERVER }}
          RELAY_SERVER: ${{ vars.RUSTDESK_RELAY_SERVER }}
          API_SERVER: ${{ vars.RUSTDESK_API_SERVER }}
        shell: python
        run: |
          import socket, ssl, os, json, concurrent.futures
          from urllib.parse import urlsplit
          def endpoint(value, default):
              if not value: raise ValueError('Server variable is not configured')
              u=urlsplit('//'+value)
              if not u.hostname or u.username or u.password or u.path: raise ValueError('Invalid server address')
              return u.hostname, u.port or default
          def probe(name, host, port, https=False, path='/'):
              report={'check':name,'host':host,'port':port,'result':'FAIL','attempts':[]}
              try:
                  infos=socket.getaddrinfo(host,port,type=socket.SOCK_STREAM)
              except Exception as e:
                  report['dns']='FAIL';report['error']=str(e);return report
              report['dns']='PASS'
              seen=set()
              for family,kind,proto,_,addr in infos:
                  if (family,addr) in seen:continue
                  seen.add((family,addr))
                  attempt={'family':'IPv6' if family==socket.AF_INET6 else 'IPv4','address':addr[0]}
                  try:
                      with socket.socket(family,kind,proto) as s:
                          s.settimeout(8);s.connect(addr)
                          if https:
                              with ssl.create_default_context().wrap_socket(s,server_hostname=host) as tls:
                                  target=path.encode('ascii')
                                  authority=host if port==443 else host+':'+str(port)
                                  tls.sendall(b'HEAD '+target+b' HTTP/1.1\r\nHost: '+authority.encode('ascii')+b'\r\nConnection: close\r\n\r\n')
                                  response=tls.recv(4096).split(b'\r\n',1)[0]
                                  if not response.startswith(b'HTTP/'):raise ValueError('No valid HTTP response')
                                  attempt['http_status']=response.decode('ascii',errors='replace')
                      attempt['result']='PASS';report['result']='PASS'
                  except Exception as e:
                      attempt['result']='FAIL';attempt['error']=str(e)
                  report['attempts'].append(attempt)
              if https:report['coverage']='HTTPS transport only; API functionality not tested'
              return report
          def tcp(name,value,port):
              try:
                  host,port=endpoint(value,port);return probe(name,host,port)
              except Exception as e:return {'check':name,'result':'FAIL','error':str(e)}
          def https():
              try:
                  u=urlsplit(os.environ['API_SERVER'])
                  if u.scheme!='https' or not u.hostname or u.username or u.password or u.fragment:raise ValueError('HTTPS API variable invalid')
                  path=u.path or '/'
                  if u.query:path+='?'+u.query
                  if any(x in path for x in ['\r','\n']):raise ValueError('Invalid API path')
                  return probe('API HTTPS transport',u.hostname,u.port or 443,True,path)
              except Exception as e:return {'check':'API HTTPS transport','result':'FAIL','error':str(e)}
          relay=os.environ['RELAY_SERVER']
          if not relay:
              try:relay=endpoint(os.environ['ID_SERVER'],21116)[0]
              except Exception:pass
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              futures=[pool.submit(tcp,'ID TCP',os.environ['ID_SERVER'],21116),pool.submit(tcp,'Relay TCP',relay,21117),pool.submit(https)]
              control=pool.submit(probe,'Public network control','github.com',443)
              results=[f.result() for f in futures];control=control.result()
          report={'checks':results,'network_control':control,'UDP':'NOT TESTED','RustDesk protocol':'NOT TESTED','Runtime/UI':'SKIPPED BY USER','Real remote session':'NOT TESTED','password_used':False}
          print(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Server connectivity (transport only)\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          if any(r['result']!='PASS' for r in results):raise SystemExit(1)
          