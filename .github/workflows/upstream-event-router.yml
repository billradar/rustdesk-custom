name: Upstream Event Router
'on':
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: upstream-event-router
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-22.04
    outputs:
      production_sha: ${{ steps.detect.outputs.production_sha }}
      production_ref: ${{ steps.detect.outputs.production_ref }}
      stable_tag: ${{ steps.detect.outputs.stable_tag }}
      stable_sha: ${{ steps.detect.outputs.stable_sha }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - id: detect
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, urllib.parse, urllib.request, urllib.error
        def api(path, missing=False):
            h={'Accept':'application/vnd.github+json','User-Agent':'rustdesk-custom-upstream-router'}
            if os.environ.get('GH_TOKEN'): h['Authorization']='Bearer '+os.environ['GH_TOKEN']
            try:
                with urllib.request.urlopen(urllib.request.Request('https://api.github.com/'+path,headers=h),timeout=30) as r:
                    return json.load(r)
            except urllib.error.HTTPError as e:
                if missing and e.code==404: return None
                raise
        repo='rustdesk/rustdesk'
        production=api(f'repos/{repo}')['default_branch']
        prod_sha=api(f'repos/{repo}/commits/{urllib.parse.quote(production,safe="")}')['sha']
        releases=api(f'repos/{repo}/releases?per_page=20')
        stable=next((x for x in releases if not x['draft'] and not x['prerelease']),None)
        with open(os.environ['GITHUB_OUTPUT'],'a') as o:
            o.write(f'production_sha={prod_sha}\nproduction_ref={production}\n')
            o.write(f'stable_tag={stable["tag_name"] if stable else ""}\n')
            if stable:
                stable_sha=api(f'repos/{repo}/commits/{urllib.parse.quote(stable["tag_name"],safe="")}')['sha']
                o.write(f'stable_sha={stable_sha}\n')
        print(f'production={production} {prod_sha}')
        if stable: print(f'stable_tag={stable["tag_name"]}')
        PY

  default-branch-debounce:
    needs: detect
    runs-on: ubuntu-22.04
    env:
      RUN_NAME: Nightly ${{ needs.detect.outputs.production_ref || 'configured-test-ref' }} / build
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Check latest routed Nightly state
      id: state
      run: |
        set -euo pipefail
        runs="$(gh run list --workflow nightly.yml --event workflow_dispatch --branch main --limit 50 --json databaseId,status,conclusion,displayTitle)"
        export RUNS="$runs"
        state="$(python3 - <<'PY'
        import json, os
        rows=json.loads(os.environ["RUNS"])
        name=os.environ["RUN_NAME"]
        for row in rows:
            if row.get("displayTitle")==name:
                status=row.get("status")
                conclusion=row.get("conclusion")
                if status in {"queued","in_progress","waiting","pending","requested"}:
                    print("ACTIVE"); break
                if conclusion=="success":
                    print("SUCCESS"); break
                print("RETRY"); break
        else:
            print("RETRY")
        PY
        )"
        echo "state=$state" >> "$GITHUB_OUTPUT"
    - name: Route default-branch change to Nightly
      if: steps.state.outputs.state == 'RETRY'
      run: |
        set -euo pipefail
        gh workflow run nightly.yml \
          --repo '${{ github.repository }}' \
          --ref main \
          -f upstream_ref='${{ needs.detect.outputs.production_ref }}' \
          -f force_rebuild=false \
          -f include_experimental=true \
          -f release_mode=build \
          -f automation_source=upstream-event-router
        echo "Nightly dispatch requested for $RUN_NAME"

  stable-tag:
    needs: detect
    if: needs.detect.outputs.stable_tag != ''
    runs-on: ubuntu-22.04
    env:
      RUN_NAME: Stable ${{ needs.detect.outputs.stable_tag }} / dry-run
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Check latest routed Stable state
      id: state
      run: |
        set -euo pipefail
        runs="$(gh run list --workflow tag.yml --event workflow_dispatch --branch main --limit 50 --json databaseId,status,conclusion,displayTitle)"
        export RUNS="$runs"
        state="$(python3 - <<'PY'
        import json, os
        rows=json.loads(os.environ["RUNS"])
        name=os.environ["RUN_NAME"]
        for row in rows:
            if row.get("displayTitle")==name:
                status=row.get("status")
                conclusion=row.get("conclusion")
                if status in {"queued","in_progress","waiting","pending","requested"}:
                    print("ACTIVE"); break
                if conclusion=="success":
                    print("SUCCESS"); break
                print("RETRY"); break
        else:
            print("RETRY")
        PY
)"
        echo "state=$state" >> "$GITHUB_OUTPUT"
    - name: Route new Stable Tag directly to Stable CD
      if: steps.state.outputs.state == 'RETRY'
      run: |
        set -euo pipefail
        gh workflow run tag.yml \
          --repo '${{ github.repository }}' \
          --ref main \
          -f upstream_ref='${{ needs.detect.outputs.stable_tag }}' \
          -f force_rebuild=false \
          -f release_mode=dry-run
        echo "Stable dispatch requested for $RUN_NAME"
