name: Production - Upstream development compatibility
permissions:
  contents: read
concurrency:
  group: upstream-compatibility
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.upstream.outputs.upstream_sha }}
      branch: ${{ steps.upstream.outputs.upstream_branch }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - id: upstream
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/upstream.py default --ref "${{ inputs.upstream_ref }}"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: compatibility-upstream-${{ github.run_id }}
        path: .work/discovery.json
  compatibility:
    needs: discover
    uses: ./.github/workflows/compat-check.yml
    with:
      upstream_repository: rustdesk/rustdesk
      upstream_ref: ${{ needs.discover.outputs.branch }}
      upstream_sha: ${{ needs.discover.outputs.sha }}
      channel: ci
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        description: Upstream production/test branch or ref
        required: true
