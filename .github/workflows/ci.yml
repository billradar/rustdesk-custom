name: CI - Patch and Build compatibility
env:
  PYTHONPATH: .
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        description: Stable upstream version
        default: ''
      force_rebuild:
        type: boolean
        description: Force rebuild
        default: false
      automation_source:
        type: string
        description: Internal source marker for Action-created CI
        default: manual
  pull_request:
  push:
    branches:
    - main
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.automation_source == 'upstream-stable-router' && 'action-created-ci' || format('normal-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.automation_source != 'upstream-stable-router' }}

jobs:
  classify:
    name: Classify repository change
    runs-on: ubuntu-22.04
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: classify
      name: Detect documentation-only changes
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_SHA: ${{ github.sha }}
        FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
      run: |
        set -euo pipefail
        args=()
        [[ "$FORCE_REBUILD" != "true" ]] || args+=(--force-rebuild)
        python3 scripts/validation/change_classification.py --github-output "${args[@]}"

  docs-only-summary:
    name: Documentation-only validation
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: ubuntu-22.04
    steps:
    - name: Report functional CI skip
      run: |
        cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
        ## Change classification: DOCS_ONLY

        Functional CI: **SKIPPED**
        Reason: documentation-only change

        - Repository architecture contract: SKIPPED
        - Build: SKIPPED
        - Compatibility: SKIPPED
        - Release qualification: SKIPPED
        - Signing: SKIPPED
        EOF

  resolve:
    needs: classify
    if: needs.classify.outputs.change_class == 'FUNCTIONAL'
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      build_needed: ${{ steps.resolve.outputs.build_needed }}
      draft_needed: ${{ steps.resolve.outputs.draft_needed }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
        CHANNEL: ci
        FORCE: ${{ inputs.force_rebuild || false }}
      run: 'args=()

        [[ "$FORCE" != true ]] || args+=(--force)

        python3 scripts/release/channel.py resolve --channel "$CHANNEL" --ref "$REQUESTED_REF" "${args[@]}"'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  compatibility:
    needs: resolve
    uses: ./.github/workflows/compat-check.yml
    with:
      upstream_repository: rustdesk/rustdesk
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: ci
  qualification:
    name: Publish CI qualification record
    needs: [resolve, compatibility]
    if: needs.compatibility.result == 'success'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Create exact CI qualification record
      env:
        CUSTOM_REPOSITORY_SHA: ${{ github.sha }}
        UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
        PATCHSET: ${{ needs.compatibility.outputs.patchset }}
        UPSTREAM_VERSION: ${{ needs.compatibility.outputs.upstream_version }}
        CI_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        import sys
        sys.path.insert(0, 'scripts')
        from scripts.upstream.patchsets import patch_hash
        patchset=os.environ['PATCHSET']
        record={
          'schema':'ci-qualification-v1',
          'qualified':True,
          'workflow':'CI - Patch and Build compatibility',
          'workflow_run_id':int(os.environ['CI_RUN_ID']),
          'event':'${{ github.event_name }}',
          'custom_repository_sha':os.environ['CUSTOM_REPOSITORY_SHA'],
          'upstream_repository':'rustdesk/rustdesk',
          'upstream_ref':os.environ['UPSTREAM_REF'],
          'upstream_sha':os.environ['UPSTREAM_SHA'],
          'upstream_version':os.environ['UPSTREAM_VERSION'],
          'patchset':patchset,
          'common_patch_hash':patch_hash('common',patchset),
          'sos_patch_hash':patch_hash('sos',patchset),
        }
        if len(record['custom_repository_sha']) != 40 or len(record['upstream_sha']) != 40:
          raise SystemExit('Invalid qualification SHA')
        Path('.work').mkdir(exist_ok=True)
        Path('.work/ci-qualification.json').write_text(json.dumps(record,indent=2)+'\n')
        print(json.dumps(record,indent=2))
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-qualification-${{ github.sha }}
        path: .work/ci-qualification.json
        if-no-files-found: error
        retention-days: 90
    - name: Preserve bridge artifact
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: test-bridge-${{ github.run_id }}
        path: .work/ci-bridge
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-bridge-${{ github.sha }}
        path: .work/ci-bridge
        if-no-files-found: error
        retention-days: 90
