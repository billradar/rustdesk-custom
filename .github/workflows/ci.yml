name: CI - Patch and Build compatibility
env:
  PYTHONPATH: .
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        description: Stable upstream version
        default: ''
      force_rebuild:
        type: boolean
        description: Force rebuild
        default: false
      promote_stable:
        type: boolean
        description: Run Stable CD dry-run after qualification
        default: false
      qualification_mode:
        type: choice
        description: Qualification ownership context
        options:
          - manual
          - stable
        default: manual
      stable_owner_run_id:
        type: string
        description: Stable release workflow run that owns this qualification
        default: ''
      stable_custom_sha:
        type: string
        description: Stable custom repository revision being qualified
        default: ''
      stable_upstream_sha:
        type: string
        description: Stable resolved upstream SHA
        default: ''
  pull_request:
  push:
    branches:
    - main
permissions:
  contents: read
  actions: write
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_mode == 'stable' && format('stable-qualification-{0}-{1}', inputs.stable_upstream_sha, inputs.upstream_ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.qualification_mode == 'stable') }}

jobs:
  classify:
    name: Classify repository change
    runs-on: ubuntu-22.04
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: classify
      name: Detect documentation-only changes
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_SHA: ${{ github.sha }}
        FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
      run: |
        set -euo pipefail
        args=()
        [[ "$FORCE_REBUILD" != "true" ]] || args+=(--force-rebuild)
        python3 scripts/validation/change_classification.py --github-output "${args[@]}"

  docs-only-summary:
    name: Documentation-only validation
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: ubuntu-22.04
    steps:
    - name: Report functional CI skip
      run: |
        cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
        ## Change classification: DOCS_ONLY

        Functional CI: **SKIPPED**
        Reason: documentation-only change

        - Repository architecture contract: SKIPPED
        - Build: SKIPPED
        - Compatibility: SKIPPED
        - Release qualification: SKIPPED
        - Signing: SKIPPED
        EOF

  resolve:
    needs: classify
    if: needs.classify.outputs.change_class == 'FUNCTIONAL'
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      build_needed: ${{ steps.resolve.outputs.build_needed }}
      draft_needed: ${{ steps.resolve.outputs.draft_needed }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
        CHANNEL: ci
        FORCE: ${{ inputs.force_rebuild || false }}
      run: 'args=()

        [[ "$FORCE" != true ]] || args+=(--force)

        python3 scripts/release/channel.py resolve --channel "$CHANNEL" --ref "$REQUESTED_REF" "${args[@]}"'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: channel-discovery-${{ github.run_id }}
        path: .work/channel.json
        if-no-files-found: warn
  compatibility:
    needs: resolve
    uses: ./.github/workflows/compat-check.yml
    with:
      upstream_repository: rustdesk/rustdesk
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      upstream_sha: ${{ needs.resolve.outputs.upstream_sha }}
      channel: ci
  qualification:
    name: Publish CI qualification record
    needs: [resolve, compatibility]
    if: needs.compatibility.result == 'success'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Validate Stable qualification ownership and source
      if: inputs.qualification_mode == 'stable'
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        STABLE_CUSTOM_SHA: ${{ inputs.stable_custom_sha }}
        STABLE_OWNER_RUN_ID: ${{ inputs.stable_owner_run_id }}
        STABLE_UPSTREAM_SHA: ${{ inputs.stable_upstream_sha }}
      run: |
        set -euo pipefail
        [[ "$STABLE_CUSTOM_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid stable_custom_sha'; exit 1; }
        [[ "$STABLE_OWNER_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid stable_owner_run_id'; exit 1; }
        [[ "$STABLE_UPSTREAM_SHA" == "${{ needs.resolve.outputs.upstream_sha }}" ]] || { echo 'Stable upstream SHA provenance mismatch'; exit 1; }
        [[ "$STABLE_CUSTOM_SHA" == "${{ github.sha }}" ]] || { echo 'Stable qualification dispatched against a different main revision'; exit 1; }
        owner_run="$(gh api "repos/$REPOSITORY/actions/runs/$STABLE_OWNER_RUN_ID")"
        [[ "$(printf '%s' "$owner_run" | jq -r .path)" == ".github/workflows/tag.yml" ]] || { echo 'Stable owner is not tag.yml'; exit 1; }
        [[ "$(printf '%s' "$owner_run" | jq -r .event)" == "workflow_dispatch" ]] || { echo 'Stable owner event mismatch'; exit 1; }
        [[ "$(printf '%s' "$owner_run" | jq -r .head_branch)" == "main" ]] || { echo 'Stable owner branch mismatch'; exit 1; }
        [[ "$(printf '%s' "$owner_run" | jq -r .head_sha)" == "$STABLE_CUSTOM_SHA" ]] || { echo 'Stable owner SHA mismatch'; exit 1; }
    - name: Create exact CI qualification record
      env:
        CUSTOM_REPOSITORY_SHA: ${{ inputs.qualification_mode == 'stable' && inputs.stable_custom_sha || github.sha }}
        UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
        PATCHSET: ${{ needs.compatibility.outputs.patchset }}
        UPSTREAM_VERSION: ${{ needs.compatibility.outputs.upstream_version }}
        CI_RUN_ID: ${{ github.run_id }}
        QUALIFICATION_MODE: ${{ inputs.qualification_mode || 'manual' }}
        STABLE_OWNER_RUN_ID: ${{ inputs.stable_owner_run_id || '' }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        import sys
        sys.path.insert(0, 'scripts')
        from scripts.upstream.patchsets import patch_hash
        patchset=os.environ['PATCHSET']
        record={
          'schema':'ci-qualification-v1',
          'qualified':True,
          'workflow':'CI - Patch and Build compatibility',
          'workflow_run_id':int(os.environ['CI_RUN_ID']),
          'event':'${{ github.event_name }}',
          'custom_repository_sha':os.environ['CUSTOM_REPOSITORY_SHA'],
          'upstream_repository':'rustdesk/rustdesk',
          'upstream_ref':os.environ['UPSTREAM_REF'],
          'upstream_sha':os.environ['UPSTREAM_SHA'],
          'upstream_version':os.environ['UPSTREAM_VERSION'],
          'patchset':patchset,
          'common_patch_hash':patch_hash('common',patchset),
          'sos_patch_hash':patch_hash('sos',patchset),
          'qualification_mode':os.environ['QUALIFICATION_MODE'],
        }
        if record['qualification_mode']=='stable':
          record['stable_owner_run_id']=int(os.environ['STABLE_OWNER_RUN_ID'])
          record['stable_custom_sha']=record['custom_repository_sha']
        if len(record['custom_repository_sha']) != 40 or len(record['upstream_sha']) != 40:
          raise SystemExit('Invalid qualification SHA')
        Path('.work').mkdir(exist_ok=True)
        Path('.work/ci-qualification.json').write_text(json.dumps(record,indent=2)+'\n')
        print(json.dumps(record,indent=2))
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-qualification-${{ github.sha }}
        path: .work/ci-qualification.json
        if-no-files-found: error
        retention-days: 90
    - name: Preserve bridge artifact for Stable CD
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: test-bridge-${{ github.run_id }}
        path: .work/ci-bridge
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-bridge-${{ github.sha }}
        path: .work/ci-bridge
        if-no-files-found: error
        retention-days: 90
    - name: Trigger Stable CD dry-run for a qualified Stable Tag
      if: inputs.promote_stable == true && startsWith(needs.resolve.outputs.upstream_ref, 'v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh workflow run tag.yml \
          --repo "${{ github.repository }}" \
          --ref main \
          -f upstream_ref="${{ needs.resolve.outputs.upstream_ref }}" \
          -f force_rebuild=false \
          -f release_mode=dry-run
