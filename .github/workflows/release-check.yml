name: Legacy Phase 3 Dry Run (reference only)
permissions:
  contents: read
concurrency:
  group: production-stable-release
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.upstream.outputs.upstream_sha }}
      tag: ${{ steps.upstream.outputs.upstream_tag }}
      build_needed: ${{ steps.upstream.outputs.build_needed }}
      publish_needed: ${{ steps.upstream.outputs.publish_needed }}
      patchset: ${{ steps.upstream.outputs.patchset }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Validate production inputs before costly preparation
      env:
        RUSTDESK_ID_SERVER: ${{ vars.RUSTDESK_ID_SERVER }}
        RUSTDESK_RELAY_SERVER: ${{ vars.RUSTDESK_RELAY_SERVER }}
        RUSTDESK_API_SERVER: ${{ vars.RUSTDESK_API_SERVER }}
        RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
        RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
      run: python3 scripts/production_config.py inputs
    - id: upstream
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.upstream_ref }}
        FORCE_REBUILD: ${{ inputs.force_rebuild }}
        DRY_RUN: 'true'
      run: 'args=()

        [[ "$FORCE_REBUILD" != true ]] || args+=(--force)

        [[ "$DRY_RUN" != true ]] || args+=(--dry-run)

        source scripts/test-config.sh

        python3 scripts/production.py discover --ref "$REQUESTED_REF" "${args[@]}"

        '
    - name: Discovery and deduplication report
      if: always()
      run: "if [[ -f .work/discovery.json ]]; then\n  { echo '## Stable discovery'; echo '```json'; cat .work/discovery.json;\
        \ echo '```'; } >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: stable-discovery-${{ github.run_id }}
        path: .work/discovery.json
        if-no-files-found: warn
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_RELEASE_ENABLED == 'true'
  build:
    needs: discover
    if: needs.discover.outputs.build_needed == 'true'
    uses: ./.github/workflows/test-build.yml
    with:
      upstream_ref: ${{ needs.discover.outputs.sha }}
      upstream_tag: ${{ needs.discover.outputs.tag }}
      variant: both
    secrets:
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
  validate:
    needs:
    - discover
    - build
    if: needs.build.result == 'success'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET: ${{ needs.discover.outputs.patchset }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.discover.outputs.sha }}
      UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
      BUILD_CONFIGURATION: PRODUCTION
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: rustdesk-*-windows-x86_64
        path: .work/collected
        merge-multiple: false
    - name: Validate paired production payload
      run: python3 scripts/production.py validate
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: production-release-assets-${{ github.run_id }}
        path: .work/production-release-assets/
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: inputs.dry_run == true
      with:
        name: production-dry-run-validated
        path: .work/production-validation.json
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Official stable release tag; empty means latest stable
        type: string
        default: 1.4.9
      force_rebuild:
        description: Rebuild artifacts only if this revision is already published; never overwrite
        type: boolean
        default: false
      dry_run:
        description: Build artifacts without Release
        type: boolean
        default: true
      dry_run_id:
        description: Validated dry-run run ID for first release
        type: string
        default: ''
