name: Repository-scoped release App token
description: Mint a short-lived release token with workflow-aware commit/tag permissions
inputs:
  client-id:
    required: true
    description: Release GitHub App Client ID
  private-key:
    required: true
    description: Release GitHub App private key from an Actions Secret
outputs:
  token:
    description: Masked installation token; use only in the release step
    value: ${{ steps.app.outputs.token }}
runs:
  using: composite
  steps:
    - id: app
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, Node.js 24
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-workflows: write
        permission-actions: read
